# firestore.rules の Emulator テスト（PR 時）
# main への push 時は firebase-rules-deploy.yml がデプロイ前に同じテストを実行する
name: Firestore rules test
on:
  pull_request:
    paths:
      - firestore.rules
      - tests/firestore-rules/**
      - .github/workflows/firestore-rules-test.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/firestore-rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/firestore-rules/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test

# Cloud Functions のデプロイ（mini-me 関連のみ）
#
# ⚠️ デプロイ対象を miniMe* の3関数に限定している。
#    既存の anthropicProxy / realtimeToken / interpreterCall / assetServe は
#    このワークフローでは触らない（意図しない再デプロイで壊さないため）。
#    対象を増やすときは deploy の --only を明示的に足すこと。
#
# 【初回実行の前提】先に Secret Manager にシークレットを登録しておくこと。
#    未登録のままだと firebase deploy が「secret does not exist」で失敗する。
#
#      npx firebase functions:secrets:set MESHY_API_KEY
#      npx firebase functions:secrets:set STRIPE_SECRET_KEY
#      npx firebase functions:secrets:set STRIPE_WEBHOOK_SECRET
#
#    ※ 対話式コマンドなので、他のコマンドと同時に貼らずに単独で実行する。
#
# 【権限】FIREBASE_SERVICE_ACCOUNT_CC_DEV_PS7 には 2026-07-13 に
#    Firebase 管理者 (roles/firebase.admin) を付与済み（firebase-rules-deploy.yml 参照）。
#    ただし Functions のデプロイには追加で以下が必要になる可能性がある（未検証）:
#      - roles/cloudfunctions.admin
#      - roles/iam.serviceAccountUser
#      - roles/secretmanager.admin（secrets: [...] を宣言した関数のバインドに必要）
#      - roles/artifactregistry.admin（gen2 のビルド成果物置き場）
#    付与場所: https://console.cloud.google.com/iam-admin/iam?project=cc-dev-ps7
#
# 【初回はシークレット登録後に workflow_dispatch で手動実行すること】
#    このファイルを paths トリガに含めていないのは、シークレット未登録の状態で
#    自動実行されて赤くなるのを避けるため。
name: Deploy Cloud Functions (mini-me)

on:
  push:
    branches:
      - main
    paths:
      - functions/mini-me.js
      - functions/index.js
      - functions/package.json
      - functions/package-lock.json
  workflow_dispatch:

jobs:
  deploy_functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # firebase CLI は exports を検出するために関数コードをローカルで読み込む。
      # そのため node_modules が必要（stripe / firebase-admin など）。
      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      # 価格ロジックの単体テスト。ここで落ちたらデプロイしない。
      - name: Run price tests
        working-directory: functions
        run: npm test

      - name: Deploy mini-me functions
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CC_DEV_PS7 }}
        run: |
          echo "$FIREBASE_SA" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          npm install -g firebase-tools@15.23.0
          firebase deploy \
            --only functions:miniMeGenerate,functions:miniMeCheckout,functions:miniMeWebhook \
            --project cc-dev-ps7 \
            --non-interactive

      - name: 失敗時のヒント
        if: failure()
        run: |
          echo "::error::デプロイに失敗した。よくある原因:"
          echo "  1) シークレット未登録 → npx firebase functions:secrets:set MESHY_API_KEY を先に実行"
          echo "  2) SA の権限不足 → cloudfunctions.admin / iam.serviceAccountUser /"
          echo "     secretmanager.admin / artifactregistry.admin を IAM で付与"
          echo "  3) package-lock.json と package.json の不整合 → functions/ で npm install し直して commit"

name: Cost safety tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: functions
      - run: npm test
        working-directory: functions
      - run: python3 -m unittest discover -s scripts -p test_cost_guard.py -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
        working-directory: tests/firestore
      - name: Firestore sharing permission tests (emulator only)
        run: npx --yes firebase-tools@15.23.0 emulators:exec --only firestore --project demo-cc-dev-cost --config firebase.rules-test.json "npm --prefix tests/firestore test"
      - name: Produce audit without deploying
        run: python3 scripts/cost_guard.py --root . --json cost-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: cost-risk-findings
          path: cost-audit.json

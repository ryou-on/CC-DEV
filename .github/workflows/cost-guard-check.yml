# コスト暴走防止チェック
# 「放置した公開サイトが AI クローラーに叩かれて高額請求」型の事故を、
# push / PR の時点で機械的に止める。詳細は docs/cost-guard.md。
name: Cost Guard Check

on:
  push:
  pull_request:

jobs:
  cost_guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # robots.txt / maxInstances / 有料APIガード / 秘密鍵 / 巨大ファイル の静的チェック
      - name: cost-guard-check
        run: node scripts/cost-guard-check.js

<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOBBY.TOKYO</title>
  <meta name="description" content="lobby.tokyo — 準備中です。" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%230a0b0d'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%2330e364'/%3E%3C/svg%3E" />
  <style>
    :root { --ink: #0a0b0d; --text: #f4f4f2; --muted: #8f959d; --green: #30e364; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center;
      background: radial-gradient(circle at 50% 30%, #14161b, var(--ink) 70%);
      color: var(--text); font-family: "Helvetica Neue", Arial, system-ui, sans-serif;
      text-align: center; padding: 24px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); margin: 0 auto 22px; box-shadow: 0 0 16px rgba(48,227,100,.7); animation: p 2.2s ease-in-out infinite; }
    @keyframes p { 0%,100%{opacity:1} 50%{opacity:.35} }
    h1 { margin: 0; font-size: clamp(30px, 6vw, 54px); font-weight: 700; letter-spacing: .28em; text-indent: .28em; }
    p { margin: 18px 0 0; color: var(--muted); font-size: 13px; letter-spacing: .22em; text-indent: .22em; }
  </style>
</head>
<body>
  <main>
    <div class="dot" aria-hidden="true"></div>
    <h1>LOBBY.TOKYO</h1>
    <p>COMING SOON</p>
  </main>
</body>
</html>

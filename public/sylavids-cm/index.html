<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sylavids 15秒CM</title>
<style>
  html, body { margin: 0; background: #0b0b0d; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* ============================================================
   Sylavids 15秒CM — 文字中心モーショングラフィック
   全ての描画は seek(t) の純粋関数（Date.now / rAF 依存なし）
   BPM120・4拍子 → 1拍 = 0.5秒、15秒 = 30拍
   ※ コピーは COPY を書き換えるだけで差し替え可能
   ============================================================ */
const COPY = {
  brand: 'Sylavids',
  l1a: '資料を、', l1b: '読み上げるだけ？',
  l2a: '受け手の疑問を、', l2b: '先回りする。',
  words: ['意図を渡す', '理解を整える', '何度でも届ける'],
  tagline: '説明を、伝わる資産に。',
  sub: 'PowerPoint / PDF から、あなたの声の説明動画へ。',
  cta: 'まずは、1本から。',
  url: 'sylavids.com',
};
const COLOR = { bg: '#0b1512', fg: '#f4f7f5', accent: '#2b917b', sub: '#7d8f89' };   // accent = ロゴのグリーン
const LOGO = {
  icon: Object.assign(new Image(), { src: 'logo-icon.png' }),
  word: Object.assign(new Image(), { src: 'logo-wordmark.png' }),
};
// 画像とフォントの読み込み完了を待つ（書き出し・プレビュー共通）
window.READY = Promise.all([
  new Promise(r => { LOGO.icon.onload = r; LOGO.icon.onerror = r; }),
  new Promise(r => { LOGO.word.onload = r; LOGO.word.onerror = r; }),
  document.fonts ? document.fonts.ready : Promise.resolve(),
]);
const FONT = '"Noto Sans JP","Hiragino Sans","Yu Gothic","IPAGothic","Meiryo",sans-serif';
const BPM = 120;
const BEAT = 60 / BPM;

window.DURATION = 15;
const W = 1920, H = 1080;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

/* ---------- イージング ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (b, s, d) => clamp((b - s) / d);            // 拍 b の区間 [s, s+d] の進行度
const outCubic = x => 1 - Math.pow(1 - x, 3);
const outExpo = x => (x === 1 ? 1 : 1 - Math.pow(2, -10 * x));
const inOutCubic = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const outBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const inCubic = x => x * x * x;

/* ---------- 描画ヘルパー ---------- */
function setFont(size, weight = 900) {
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.textBaseline = 'alphabetic';
}

// マスク付きせり上がり文字（行の枠内でテキストが下から出る）
function maskedText(text, cx, baseY, size, p, color, align = 'center', outP = 0) {
  setFont(size);
  ctx.textAlign = align;
  const lineH = size * 1.15;
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, baseY - size * 1.0, W, lineH);
  ctx.clip();
  const inY = (1 - outExpo(p)) * lineH;
  const outY = -inCubic(outP) * lineH;
  ctx.fillStyle = color;
  ctx.fillText(text, cx, baseY + inY + outY);
  ctx.restore();
}

function fillBg(color) { ctx.fillStyle = color; ctx.fillRect(0, 0, W, H); }

// 拍に同期したアクセントの四角（背景のリズム装飾）
function accentBar(x, y, w, h, p, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w * outExpo(p), h);
}

/* ---------- シーン ---------- */
// S1: 0〜4拍「動画って、見るだけ？」
function scene1(b) {
  fillBg(COLOR.bg);
  const out = prog(b, 3.5, 0.5);
  maskedText(COPY.l1a, W / 2, 470, 150, prog(b, 0, 1), COLOR.fg, 'center', out);
  maskedText(COPY.l1b, W / 2, 680, 200, prog(b, 1, 1.2), COLOR.accent, 'center', out);
  // 下線がのびる
  accentBar(W / 2 - 360, 740, 720, 10, prog(b, 2, 1), COLOR.fg);
}

// S2: 4〜8拍「もう、待たない。」アクセント背景に反転
function scene2(b) {
  const wipe = outExpo(prog(b, 4, 0.7));           // 背景ワイプ
  fillBg(COLOR.bg);
  ctx.fillStyle = COLOR.accent;
  ctx.fillRect(0, 0, W * wipe, H);
  const out = prog(b, 7.5, 0.5);
  maskedText(COPY.l2a, W / 2, 470, 150, prog(b, 4.6, 1), COLOR.fg, 'center', out);
  // 「待たない。」は一文字ずつ拍に合わせて出る
  setFont(260);
  ctx.textAlign = 'left';
  const chars = [...COPY.l2b];
  const widths = chars.map(c => ctx.measureText(c).width);
  const total = widths.reduce((a, c) => a + c, 0);
  let x = W / 2 - total / 2;
  chars.forEach((ch, i) => {
    const p = prog(b, 5.2 + i * 0.3, 0.6);
    const lineH = 260 * 1.15;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 720 - 260, W, lineH); ctx.clip();
    ctx.fillStyle = COLOR.fg;
    ctx.fillText(ch, x, 720 + (1 - outBack(p)) * lineH + -inCubic(out) * lineH);
    ctx.restore();
    x += widths[i];
  });
}

// S3: 8〜14拍 つくる / つなぐ / ひろがる を2拍ごとに積む
function scene3(b) {
  fillBg(COLOR.bg);
  const out = prog(b, 13.5, 0.5);
  const sizes = 170, gap = 240;
  COPY.words.forEach((w, i) => {
    const start = 8 + i * 2;
    const p = prog(b, start, 1);
    const y = 330 + i * gap;
    // 左のアクセントバー
    accentBar(240, y - 150, 24, 170, prog(b, start, 0.8), COLOR.accent);
    maskedText(w, 320, y, sizes, p, i === 2 ? COLOR.accent : COLOR.fg, 'left', out);
    // 右側に連番
    setFont(60, 700);
    ctx.textAlign = 'right';
    ctx.fillStyle = COLOR.sub;
    ctx.globalAlpha = outCubic(p) * (1 - out);
    ctx.fillText('0' + (i + 1), W - 240, y - 20);
    ctx.globalAlpha = 1;
  });
}

// S4: 14〜26拍 白に反転 → アイコンがポップ → ワードマークがワイプ表示 → タグライン
function scene4(b) {
  const bgP = outExpo(prog(b, 14, 0.8));
  fillBg(COLOR.bg);
  ctx.save();
  ctx.fillStyle = COLOR.fg;
  ctx.beginPath();
  ctx.arc(W / 2, H / 2, Math.hypot(W, H) * 0.6 * bgP, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // アイコンがバウンドしながら登場 → 縮小フェードしてワードマークへ
  const pop = outBack(prog(b, 14.8, 1.2));
  const handoff = inOutCubic(prog(b, 17, 1.5));
  const iconSize = 460 * pop * (1 - 0.25 * handoff);
  ctx.globalAlpha = 1 - handoff;
  ctx.drawImage(LOGO.icon, W / 2 - iconSize / 2, 470 - iconSize / 2, iconSize, iconSize);
  ctx.globalAlpha = 1;

  // ワードマークを中央から左右にワイプ
  const ww = 1100, wh = ww * LOGO.word.height / LOGO.word.width;
  const wipe = outExpo(prog(b, 17.2, 1.4));
  ctx.save();
  ctx.beginPath();
  ctx.rect(W / 2 - (ww / 2) * wipe, 0, ww * wipe, H);
  ctx.clip();
  ctx.drawImage(LOGO.word, W / 2 - ww / 2, 470 - wh / 2, ww, wh);
  ctx.restore();

  // タグライン
  maskedText(COPY.tagline, W / 2, 760, 78, prog(b, 19.5, 1.2), COLOR.bg, 'center');
  maskedText(COPY.sub, W / 2, 850, 44, prog(b, 21, 1.2), '#4a5c56', 'center');
}

// S5: 26〜30拍 ロゴ＋CTA＋URL（白背景のまま）
function scene5(b) {
  fillBg(COLOR.fg);
  const ww = 1100, wh = ww * LOGO.word.height / LOGO.word.width;
  const move = inOutCubic(prog(b, 26, 1));
  const sc = 1 - 0.35 * move;
  ctx.drawImage(LOGO.word, W / 2 - ww * sc / 2, 470 - 80 * move - wh * sc / 2, ww * sc, wh * sc);
  maskedText(COPY.cta, W / 2, 640, 96, prog(b, 27, 1.2), COLOR.bg, 'center');
  maskedText(COPY.url, W / 2, 780, 70, prog(b, 27.6, 1.2), COLOR.accent, 'center');
  accentBar(W / 2 - 160, 830, 320, 8, prog(b, 28, 1), COLOR.accent);
}

/* ---------- メイン：時刻 t のフレームを描画 ---------- */
window.seek = function (t) {
  const b = t / BEAT;                       // 拍番号
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  if (b < 4) scene1(b);
  else if (b < 8) scene2(b);
  else if (b < 14) scene3(b);
  else if (b < 26) scene4(b);
  else scene5(b);
  // 最終0.5秒でフェードアウト
  const fade = prog(t, 14.5, 0.5);
  if (fade > 0) { ctx.fillStyle = `rgba(244,247,245,${fade})`; ctx.fillRect(0, 0, W, H); }
};

// ブラウザで開いた場合は実時間で再生プレビュー（書き出しには影響しない）
window.READY.then(() => {
  if (!navigator.webdriver) {
    const t0 = performance.now();
    const loop = () => { window.seek(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    loop();
  } else {
    window.seek(0);
  }
});
</script>
</body>
</html>

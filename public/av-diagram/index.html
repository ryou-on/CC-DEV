/* ============================================================

   ============================================================ */
const LOG_BUFFER = [];
['log', 'warn', 'error', 'info'].forEach(level => {
  const orig = console[level].bind(console);
  console[level] = (...args) => {
    try {
      LOG_BUFFER.push(`[${new Date().toISOString()}] [${level}] ` + args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '));
      if (LOG_BUFFER.length > 500) LOG_BUFFER.shift();
    } catch (e) {}
    orig(...args);
  };
});
window.addEventListener('error', e => console.error('window.error', e.message));

/* ============================================================
   機材データベース
   spec: [type, dir, label, count]  count>1 なら「label 1..n」
   LR(): L/R ペアを生成
   ============================================================ */
function makePorts(spec) {
  const ports = [];
  for (const [type, dir, label, count = 1] of spec) {
    for (let i = 1; i <= count; i++) {
      const lbl = count > 1 ? `${label} ${i}` : label;
      ports.push({ id: `${type}_${dir}_${lbl}`.replace(/[^\w]+/g, '_').toLowerCase(), type, dir, label: lbl });
    }
  }
  return ports;
}

/* ============================================================
   状態
   ============================================================ */
const LS_KEY = 'avdiagram_autosave';
const LS_CUSTOM = 'avdiagram_custom';
let state = { name: '', nodes: [], conns: [], custom: [], photoMode: false };
let view = { x: 60, y: 60, k: 1 };
let selection = null;        // {type:'node'|'conn', id}
let history = [];
let drag = null;             // 現在のドラッグ操作
let activeTab = 'prop';

const uid = () => Math.random().toString(36).slice(2, 10);
const $ = id => document.getElementById(id);
const svg = $('canvas'), world = $('world'), connLayer = $('connLayer'), nodeLayer = $('nodeLayer'), tempLayer = $('tempLayer');

function allDevices() { return [...DEVICES, ...state.custom]; }
function getDevice(id) { return allDevices().find(d => d.id === id); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ============================================================
   ノード形状
   ============================================================ */
const NODE_W = 230, HEAD_H = 36, ROW_H = 17, PORT_R = 6;
const PHOTO_W = 160, PHOTO_H = 112, PHOTO_NODE_W = 330;
// 機材の写真（アップロード優先、無ければ内蔵写真）
function photoSrc(node) { return node.photo || PHOTOS[node.def.id] || null; }
function nodeGeom(node) {
  const ins = node.def.ports.filter(p => p.dir === 'in');
  const outs = node.def.ports.filter(p => p.dir === 'out');
  const bis = node.def.ports.filter(p => p.dir === 'bi');
  const rows = Math.max(ins.length, outs.length, 1);
  const photo = state.photoMode ? photoSrc(node) : null;
  const bodyH = Math.max(rows * ROW_H + 10, photo ? PHOTO_H + 16 : 0);
  const h = HEAD_H + bodyH + (bis.length ? (bis.length > 1 ? 26 : 18) : 0);
  return { w: photo ? PHOTO_NODE_W : NODE_W, h, ins, outs, bis, photo };
}
function portLabel(p) {
  const t = PORT_TYPES[p.type];
  if (t && t.gender) {
    const g = p.dir === 'in' ? '♀' : '♂';
    return p.label.includes('XLR') ? p.label.replace('XLR', 'XLR' + g) : `${p.label} ${g}`;
  }
  return p.label;
}
// ノード内でのポート位置（ローカル座標）と接線方向
function portLocal(node, portId) {
  const g = nodeGeom(node);
  let i = g.ins.findIndex(p => p.id === portId);
  if (i >= 0) return { x: 0, y: HEAD_H + 12 + i * ROW_H, dx: -1, dy: 0 };
  i = g.outs.findIndex(p => p.id === portId);
  if (i >= 0) return { x: g.w, y: HEAD_H + 12 + i * ROW_H, dx: 1, dy: 0 };
  i = g.bis.findIndex(p => p.id === portId);
  if (i >= 0) {
    const n = g.bis.length, spacing = Math.min(34, (g.w - 40) / Math.max(n - 1, 1));
    return { x: g.w / 2 - (n - 1) * spacing / 2 + i * spacing, y: g.h, dx: 0, dy: 1 };
  }
  return { x: g.w / 2, y: g.h / 2, dx: 0, dy: 0 };
}
function portWorld(node, portId) {
  const l = portLocal(node, portId);
  return { x: node.x + l.x, y: node.y + l.y, dx: l.dx, dy: l.dy };
}
function findPort(node, portId) { return node.def.ports.find(p => p.id === portId); }
function portOccupied(nodeId, portId) {
  return state.conns.some(c => (c.a.node === nodeId && c.a.port === portId) || (c.b.node === nodeId && c.b.port === portId));
}

/* ============================================================
   接続可否判定（端子種別・向き・オスメス）
   ============================================================ */
function checkCompat(nodeA, portA, nodeB, portB) {
  if (nodeA.id === nodeB.id) return { ok: false, msg: '同じ機材の端子同士は接続できません' };
  if (portA.type !== portB.type) {
    return { ok: false, msg: `${PORT_TYPES[portA.type].label} 端子は ${PORT_TYPES[portA.type].label} 端子にしか接続できません（相手: ${PORT_TYPES[portB.type].label}）` };
  }
  const t = PORT_TYPES[portA.type];
  if (portA.dir === 'in' && portB.dir === 'in') return { ok: false, msg: t.gender ? '入力(メス)同士は接続できません' : '入力同士は接続できません' };
  if (portA.dir === 'out' && portB.dir === 'out') return { ok: false, msg: t.gender ? '出力(オス)同士は接続できません' : '出力同士は接続できません' };
  if (portOccupied(nodeB.id, portB.id)) return { ok: false, msg: 'その端子は既に使用中です' };
  return { ok: true };
}

/* ============================================================
   描画
   ============================================================ */
function connPath(a, b) {
  const dist = Math.hypot(b.x - a.x, b.y - a.y);
  const d = Math.max(40, Math.min(160, dist / 2));
  const c1 = { x: a.x + a.dx * d, y: a.y + a.dy * d };
  const c2 = { x: b.x + b.dx * d, y: b.y + b.dy * d };
  const mid = bezierPoint(a, c1, c2, b, 0.5);
  return { d: `M ${a.x} ${a.y} C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${b.x} ${b.y}`, mid };
}
function bezierPoint(p0, p1, p2, p3, t) {
  const mt = 1 - t;
  return {
    x: mt * mt * mt * p0.x + 3 * mt * mt * t * p1.x + 3 * mt * t * t * p2.x + t * t * t * p3.x,
    y: mt * mt * mt * p0.y + 3 * mt * mt * t * p1.y + 3 * mt * t * t * p2.y + t * t * t * p3.y,
  };
}
function connLabel(c) {
  const na = state.nodes.find(n => n.id === c.a.node);
  const pa = na && findPort(na, c.a.port);
  const t = pa ? PORT_TYPES[pa.type] : null;
  let s = t ? t.label.replace(/ \(.*\)$/, '') : '';
  if (c.length) s += ` ${c.length}m`;
  return s;
}
function renderNodesSvg(opts = {}) {
  let out = '';
  for (const node of state.nodes) {
    const g = nodeGeom(node), cat = CATEGORIES[node.def.cat] || CATEGORIES.custom;
    const sel = !opts.export && selection && selection.type === 'node' && selection.id === node.id;
    out += `<g data-node="${node.id}" transform="translate(${node.x},${node.y})">`;
    out += `<rect class="node-body" x="0" y="0" width="${g.w}" height="${g.h}" rx="6" fill="#ffffff" stroke="${sel ? '#0ea5e9' : '#94a3b8'}" stroke-width="${sel ? 3 : 1.2}"/>`;
    out += `<path class="node-body" d="M 0 6 a 6 6 0 0 1 6 -6 h ${g.w - 12} a 6 6 0 0 1 6 6 v ${HEAD_H - 6} h -${g.w} z" fill="${cat.color}"/>`;
    out += `<text class="node-body" x="8" y="15" font-size="12" font-weight="700" fill="#fff">${esc(node.def.icon)} ${esc(node.label)}</text>`;
    out += `<text class="node-body" x="8" y="29" font-size="9" fill="#e2e8f0">${esc(node.def.brand)} ${esc(node.def.name)}</text>`;
    if (g.photo) {
      const py = HEAD_H + 8 + Math.max(0, (g.h - HEAD_H - (g.bis.length ? (g.bis.length > 1 ? 26 : 18) : 0) - 16 - PHOTO_H) / 2);
      out += `<image class="node-body" href="${g.photo}" x="${(g.w - PHOTO_W) / 2}" y="${py}" width="${PHOTO_W}" height="${PHOTO_H}" preserveAspectRatio="xMidYMid meet"/>`;
    }
    for (const p of node.def.ports) {
      const l = portLocal(node, p.id), t = PORT_TYPES[p.type], color = SIGNALS[t.signal].color;
      const used = portOccupied(node.id, p.id);
      const snap = !opts.export && drag && drag.type === 'conn' && drag.snap && drag.snap.node === node.id && drag.snap.port === p.id;
      const compat = !opts.export && drag && drag.type === 'conn' && drag.compat && drag.compat.has(node.id + '|' + p.id);
      if (snap) out += `<circle class="snap-ring" cx="${l.x}" cy="${l.y}" r="10" fill="none" stroke="${color}" stroke-width="2"/>`;
      out += `<circle class="port" data-node="${node.id}" data-port="${p.id}" cx="${l.x}" cy="${l.y}" r="${compat ? PORT_R + 2 : PORT_R}" fill="${used ? color : '#fff'}" stroke="${color}" stroke-width="${compat ? 3 : 2}"><title>${esc(portLabel(p))} — ${esc(t.label)} ${DIRS[p.dir]}${used ? '（使用中）' : ''}</title></circle>`;
      if (p.dir === 'in') out += `<text class="node-body" x="${l.x + 10}" y="${l.y + 3}" font-size="9" fill="#334155">${esc(portLabel(p))}</text>`;
      else if (p.dir === 'out') out += `<text class="node-body" x="${l.x - 10}" y="${l.y + 3}" font-size="9" fill="#334155" text-anchor="end">${esc(portLabel(p))}</text>`;
      else { const bi = g.bis.indexOf(p); out += `<text class="node-body" x="${l.x}" y="${l.y - (bi % 2 ? 18 : 9)}" font-size="7.5" fill="#334155" text-anchor="middle">${esc(p.label)}</text>`; }
    }
    if (node.note) out += `<text x="0" y="${g.h + 12}" font-size="9" fill="#64748b">📝 ${esc(node.note)}</text>`;
    out += `</g>`;
  }
  return out;
}
function renderConnsSvg(opts = {}) {
  let out = '';
  for (const c of state.conns) {
    const na = state.nodes.find(n => n.id === c.a.node), nb = state.nodes.find(n => n.id === c.b.node);
    if (!na || !nb) continue;
    const pa = findPort(na, c.a.port); if (!pa) continue;

/* ============================================================
   座標変換
   ============================================================ */
function toWorld(sx, sy) {

function snapGrid(v) { return Math.round(v / 10) * 10; }

/* ============================================================
   履歴・保存

function pushHistory() {

}
function undo() {
  const s = history.pop();

  render(); autosave();
}
function autosave() {

}
function loadAutosave() {

    const s = localStorage.getItem(LS_KEY);

  } catch (e) {}

}

}

}

/* ============================================================
   ノード・接続の操作
   ============================================================ */
function addNode(defId, x, y, label) {
  const def = getDevice(defId);
  if (!def) { toast('機材定義が見つかりません: ' + defId); return null; }
  pushHistory();
  const node = { id: uid(), x: snapGrid(x), y: snapGrid(y), label: label || def.name, note: '', def: JSON.parse(JSON.stringify(def)) };
  state.nodes.push(node);
  selection = { type: 'node', id: node.id };
  render(); autosave();
  console.log('addNode', def.name);
  return node;
}
function deleteNode(id) {
  pushHistory();
  state.nodes = state.nodes.filter(n => n.id !== id);
  state.conns = state.conns.filter(c => c.a.node !== id && c.b.node !== id);
  if (selection && selection.type === 'node' && selection.id === id) selection = null;
  render(); autosave();
}
function duplicateNode(id) {
  const n = state.nodes.find(x => x.id === id); if (!n) return;
  pushHistory();
  const copy = JSON.parse(JSON.stringify(n)); copy.id = uid(); copy.x += 30; copy.y += 30;
  state.nodes.push(copy); selection = { type: 'node', id: copy.id };
  render(); autosave();
}
// ---- 配置済み機材の編集（名前・端子・写真） ----
function dropConnsOfPort(nodeId, portId) {
  const before = state.conns.length;
  state.conns = state.conns.filter(c => !((c.a.node === nodeId && c.a.port === portId) || (c.b.node === nodeId && c.b.port === portId)));
  return before - state.conns.length;
}
function editPort(node, portId, patch) {
  const p = findPort(node, portId); if (!p) return;
  pushHistory();
  const changed = (patch.type && patch.type !== p.type) || (patch.dir && patch.dir !== p.dir);
  Object.assign(p, patch);
  if (changed && dropConnsOfPort(node.id, portId)) toast('端子の種別/向きを変更したため、接続していたケーブルを外しました');
  node.def.edited = true; render(); autosave();
}
function addPortToNode(node, type = 'hdmi', dir = 'in') {
  pushHistory();
  const n = node.def.ports.filter(p => p.type === type && p.dir === dir).length + 1;
  node.def.ports.push({ id: 'p_' + uid(), type, dir, label: `${PORT_TYPES[type].label.split(' ')[0]} ${dir === 'in' ? 'IN' : dir === 'out' ? 'OUT' : ''} ${n}`.replace(/\s+/g, ' ').trim() });
  node.def.edited = true; render(); autosave();
}
function removePort(node, portId) {
  pushHistory();
  dropConnsOfPort(node.id, portId);
  node.def.ports = node.def.ports.filter(p => p.id !== portId);
  node.def.edited = true; render(); autosave();
}
function saveNodeAsCustom(node) {
  const def = JSON.parse(JSON.stringify(node.def));
  def.id = 'custom-' + uid(); def.note = 'カスタム機材（編集済み構成）'; delete def.edited;
  state.custom.push(def); saveCustomDevices(); renderPalette();
  toast(`「${def.name}」をパレットに追加しました`);
}
function setNodePhoto(node, file) {
  if (!file || !file.type.startsWith('image/')) { toast('画像ファイルを選択してください'); return; }
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      const max = 480, k = Math.min(1, max / Math.max(im.width, im.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
      const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(im, 0, 0, cv.width, cv.height);
      pushHistory(); node.photo = cv.toDataURL('image/jpeg', 0.82);
      if (!state.photoMode) { state.photoMode = true; toast('写真モードに切り替えました'); }
      render(); autosave();
    };
    im.onerror = () => toast('画像を読み込めませんでした');

}
function addConn(a, b, extra = {}) {
  const na = state.nodes.find(n => n.id === a.node), nb = state.nodes.find(n => n.id === b.node);
  if (!na || !nb) return null;
  const pa = findPort(na, a.port), pb = findPort(nb, b.port);
  if (!pa || !pb) return null;
  if (portOccupied(na.id, pa.id)) { toast('その端子は既に使用中です'); return null; }
  const r = checkCompat(na, pa, nb, pb);
  if (!r.ok) { toast('⚠ ' + r.msg); return null; }
  pushHistory();
  // 出力→入力の向きに正規化（bi は元の順）
  let A = a, B = b;
  if (pa.dir === 'in' && pb.dir !== 'in') { A = b; B = a; }
  const c = { id: uid(), a: A, b: B, length: extra.length || null, note: extra.note || '' };
  state.conns.push(c);
  selection = { type: 'conn', id: c.id };
  render(); autosave();
  console.log('addConn', na.label, pa.label, '->', nb.label, pb.label);

}
function deleteConn(id) {
  pushHistory();
  state.conns = state.conns.filter(c => c.id !== id);
  if (selection && selection.type === 'conn' && selection.id === id) selection = null;
  render(); autosave();
}
function deleteSelection() {
  if (!selection) { toast('削除する対象を選択してください'); return; }
  if (selection.type === 'node') deleteNode(selection.id); else deleteConn(selection.id);

/* ============================================================
   ポインタ操作（配置・移動・結線・パン・ズーム）
   ============================================================ */
const SNAP_PX = 26, HOVER_PX = 14;
svg.addEventListener('pointerdown', e => {
  if (e.button === 1 || (e.button === 0 && e.target === svg) || e.target.id === 'gridRect' || (e.button === 0 && e.altKey)) {
    drag = { type: 'pan', sx: e.clientX, sy: e.clientY, ox: view.x, oy: view.y };
    svg.classList.add('panning');
    if (e.target === svg || e.target.id === 'gridRect') { selection = null; render(); }
    return;
  }
  const portEl = e.target.closest('[data-port]');
  if (portEl) {
    const nodeId = portEl.dataset.node, portId = portEl.dataset.port;
    if (portOccupied(nodeId, portId)) { toast('この端子は使用中です。先に既存のケーブルを削除してください'); return; }
    const node = state.nodes.find(n => n.id === nodeId), port = findPort(node, portId);
    // 接続可能な端子集合を事前計算（ハイライト用）
    const compat = new Set();
    for (const n of state.nodes) for (const p of n.def.ports) if (checkCompat(node, port, n, p).ok) compat.add(n.id + '|' + p.id);
    drag = { type: 'conn', from: { node: nodeId, port: portId }, cur: toWorld(e.clientX, e.clientY), snap: null, compat };
    render();
    return;
  }
  const connEl = e.target.closest('[data-conn]');
  if (connEl) { selection = { type: 'conn', id: connEl.dataset.conn }; render(); return; }
  const nodeEl = e.target.closest('[data-node]');
  if (nodeEl) {
    const node = state.nodes.find(n => n.id === nodeEl.dataset.node);
    selection = { type: 'node', id: node.id };
    const w = toWorld(e.clientX, e.clientY);
    drag = { type: 'node', id: node.id, ox: w.x - node.x, oy: w.y - node.y, moved: false, startX: node.x, startY: node.y };
    // 最前面へ
    state.nodes = state.nodes.filter(n => n.id !== node.id).concat(node);
    render();
  }
});
window.addEventListener('pointermove', e => {
  if (!drag) return;
  if (drag.type === 'pan') {
    view.x = drag.ox + (e.clientX - drag.sx); view.y = drag.oy + (e.clientY - drag.sy);
    world.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`);
    return;
  }
  const w = toWorld(e.clientX, e.clientY);
  if (drag.type === 'node') {
    const node = state.nodes.find(n => n.id === drag.id);
    const nx = snapGrid(w.x - drag.ox), ny = snapGrid(w.y - drag.oy);
    if (nx !== node.x || ny !== node.y) {
      if (!drag.moved) { pushHistory(); drag.moved = true; }
      node.x = nx; node.y = ny;
      connLayer.innerHTML = renderConnsSvg(); nodeLayer.innerHTML = renderNodesSvg();
    }
    return;
  }
  if (drag.type === 'conn') {
    drag.cur = w;
    // マグネット吸着：接続可能端子のうち最も近いもの（画面上 SNAP_PX 以内）
    // ただし非互換端子の真上（HOVER_PX 以内）にいる場合は吸着させず、理由を保持する
    let best = null, bestD = SNAP_PX / view.k, hover = null, hoverD = HOVER_PX / view.k;
    const na = state.nodes.find(n => n.id === drag.from.node), pa = findPort(na, drag.from.port);
    for (const n of state.nodes) for (const p of n.def.ports) {
      const pw = portWorld(n, p.id), d = Math.hypot(pw.x - w.x, pw.y - w.y);
      if (d < hoverD) { hoverD = d; hover = { n, p }; }
      if (!drag.compat.has(n.id + '|' + p.id)) continue;
      if (d < bestD) { bestD = d; best = { node: n.id, port: p.id }; }
    }
    drag.reject = null;
    if (hover && !drag.compat.has(hover.n.id + '|' + hover.p.id) && hover.n.id !== na.id) {
      best = null; drag.reject = checkCompat(na, pa, hover.n, hover.p).msg;
    }
    drag.snap = best;
    render();
  }
});
window.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag = null; svg.classList.remove('panning');
  if (d.type === 'conn') {
    if (d.snap) addConn(d.from, d.snap);
    else {
      // 吸着していない場合、非互換端子の上で離したなら理由を表示
      if (d.reject) toast('⚠ ' + d.reject);
      render();
    }

  else render();
});
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const factor = Math.exp(-e.deltaY * 0.0012);
  const nk = Math.min(3, Math.max(0.2, view.k * factor));
  view.x = mx - (mx - view.x) * (nk / view.k); view.y = my - (my - view.y) * (nk / view.k); view.k = nk;
  render(); autosave();
}, { passive: false });
svg.addEventListener('dblclick', e => {
  const nodeEl = e.target.closest('[data-node]');
  if (nodeEl) {
    const node = state.nodes.find(n => n.id === nodeEl.dataset.node);
    const v = prompt('機材のラベル（例：C-1 メインカメラ）', node.label);
    if (v !== null && v.trim()) { pushHistory(); node.label = v.trim(); render(); autosave(); }
  }
});
// パレットからのドロップ
svg.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
svg.addEventListener('drop', e => {
  e.preventDefault();
  const id = e.dataTransfer.getData('text/plain');
  if (!id) return;
  const w = toWorld(e.clientX, e.clientY);
  addNode(id, w.x - NODE_W / 2, w.y - 20);
});
// キーボード
window.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelection(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveJson(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') { e.preventDefault(); if (selection && selection.type === 'node') duplicateNode(selection.id); }
  else if (e.key === 'Escape') { if (drag) { drag = null; render(); } else if ($('modal').classList.contains('hidden') === false) closeModal(); else { selection = null; render(); } }
});

function fitView() {
  if (!state.nodes.length) { view = { x: 60, y: 60, k: 1 }; render(); return; }
  const bb = bbox(); const r = svg.getBoundingClientRect();
  const k = Math.min(3, Math.max(0.2, Math.min((r.width - 40) / bb.w, (r.height - 60) / bb.h)));
  view = { x: (r.width - bb.w * k) / 2 - bb.x * k, y: (r.height - bb.h * k) / 2 - bb.y * k + 10, k };
  render(); autosave();
}
function bbox() {
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  for (const n of state.nodes) { const g = nodeGeom(n); x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y); x2 = Math.max(x2, n.x + g.w); y2 = Math.max(y2, n.y + g.h + (n.note ? 16 : 0)); }
  // 結線（ベジェ曲線）のはみ出し分も含める
  for (const c of state.conns) {
    const na = state.nodes.find(n => n.id === c.a.node), nb = state.nodes.find(n => n.id === c.b.node);
    if (!na || !nb) continue;
    const A = portWorld(na, c.a.port), B = portWorld(nb, c.b.port);
    const dist = Math.hypot(B.x - A.x, B.y - A.y), d = Math.max(40, Math.min(160, dist / 2));
    const c1 = { x: A.x + A.dx * d, y: A.y + A.dy * d }, c2 = { x: B.x + B.dx * d, y: B.y + B.dy * d };
    for (let t = 0; t <= 1.001; t += 0.1) { const q = bezierPoint(A, c1, c2, B, t); x1 = Math.min(x1, q.x); y1 = Math.min(y1, q.y); x2 = Math.max(x2, q.x); y2 = Math.max(y2, q.y + 12); }
  }
  const m = 40;
  return { x: x1 - m, y: y1 - m, w: x2 - x1 + m * 2, h: y2 - y1 + m * 2 };
}

function renderPalette() {
  const q = ($('paletteSearch').value || '').trim().toLowerCase();
  const devices = allDevices().filter(d => !q || `${d.brand} ${d.name} ${d.note} ${d.ports.map(p => p.label + ' ' + PORT_TYPES[p.type].label).join(' ')}`.toLowerCase().includes(q));
  let html = '';

    if (!list.length) continue;
    html += `<div><div class="text-[11px] font-bold text-white px-2 py-0.5 rounded" style="background:${meta.color}">${meta.label}</div><div class="mt-1 space-y-1">`;
    for (const d of list) {
      const ins = d.ports.filter(p => p.dir === 'in').length, outs = d.ports.filter(p => p.dir === 'out').length, bis = d.ports.filter(p => p.dir === 'bi').length;
      html += `<div class="palette-item flex items-center gap-1 px-2 py-1 rounded border border-slate-200 hover:bg-sky-50 hover:border-sky-300" draggable="true" data-dev="${d.id}" title="${esc(d.note || '')}\n入力${ins} / 出力${outs} / 双方向${bis}">
        <span class="text-base">${d.icon}</span>
        <div class="flex-1 min-w-0"><div class="text-xs font-bold truncate">${esc(d.name)}</div><div class="text-[10px] text-slate-500 truncate">${esc(d.brand)} · IN${ins} OUT${outs}${bis ? ' BI' + bis : ''}</div></div>
        ${d.cat === 'custom' ? `<button class="text-[10px] text-slate-400 hover:text-red-600" data-delcustom="${d.id}" title="カスタム機材を削除">✕</button>` : ''}
      </div>`;
    }
    html += `</div></div>`;
  }
  if (!html) html = '<div class="text-xs text-slate-500">該当する機材がありません。「カスタム機材を作成」で追加できます。</div>';

$('palette').addEventListener('click', e => {

/* ============================================================

   ============================================================ */
function equipmentRows() {
  const map = new Map();
  for (const n of state.nodes) {
    const key = n.def.id;
    if (!map.has(key)) map.set(key, { brand: n.def.brand, name: n.def.name, cat: CATEGORIES[n.def.cat]?.label || '', count: 0, labels: [] });
    const r = map.get(key); r.count++; r.labels.push(n.label);
  }
  return [...map.values()].sort((a, b) => (a.cat + a.brand + a.name).localeCompare(b.cat + b.brand + b.name, 'ja'));
}
function cableRows() {
  return state.conns.map((c, i) => {
    const na = state.nodes.find(n => n.id === c.a.node), nb = state.nodes.find(n => n.id === c.b.node);
    const pa = na && findPort(na, c.a.port), pb = nb && findPort(nb, c.b.port);
    const t = pa ? PORT_TYPES[pa.type] : { cable: '?', signal: 'control' };
    return { no: i + 1, signal: SIGNALS[t.signal].label, cable: t.cable, from: na ? na.label : '?', fromPort: pa ? portLabel(pa) : '?', to: nb ? nb.label : '?', toPort: pb ? portLabel(pb) : '?', length: c.length ?? '', note: c.note || '' };
  });
}
function cableSummary() {
  const map = new Map();
  for (const r of cableRows()) {
    if (!map.has(r.cable)) map.set(r.cable, { cable: r.cable, count: 0, total: 0, unknown: 0 });
    const s = map.get(r.cable); s.count++; if (r.length === '') s.unknown++; else s.total += Number(r.length);
  }
  return [...map.values()];
}
function renderLists() {

  const cs = cableSummary(), cr = cableRows();

      <div class="pl-5 text-slate-600">${esc(r.from)} <span class="text-slate-400">[${esc(r.fromPort)}]</span> → ${esc(r.to)} <span class="text-slate-400">[${esc(r.toPort)}]</span></div>

  $('tab-cable').querySelectorAll('[data-selconn]').forEach(el => el.addEventListener('click', () => { selection = { type: 'conn', id: el.dataset.selconn }; activateTab('prop'); render(); }));

/* ============================================================
   JSON 保存・読込
   ============================================================ */
function serialize() {
  return { app: 'av-diagram', version: APP_VERSION, savedAt: new Date().toISOString(), name: state.name, nodes: state.nodes, conns: state.conns, customDevices: state.custom, photoMode: state.photoMode, view };
}
function saveJson() {
  const blob = new Blob([JSON.stringify(serialize(), null, 2)], { type: 'application/json' });
  download(blob, `${fileBase()}.json`).then(() => toast('JSON を保存しました'));
}
function loadJsonObject(o) {
  if (!o || !Array.isArray(o.nodes)) { toast('⚠ 対応していないJSON形式です'); return; }
  pushHistory();
  state.name = o.name || ''; state.nodes = o.nodes; state.conns = o.conns || []; state.photoMode = !!o.photoMode;
  // カスタム機材をマージ
  for (const d of (o.customDevices || [])) if (!state.custom.some(x => x.id === d.id)) state.custom.push(d);
  saveCustomDevices();
  $('projectName').value = state.name;
  selection = null; renderPalette(); fitView(); autosave();
  toast(`読み込みました：機材 ${state.nodes.length} 台 / ケーブル ${state.conns.length} 本`);
}
$('btnOpen').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => { try { loadJsonObject(JSON.parse(fr.result)); } catch (err) { console.error(err); toast('⚠ JSON の読み込みに失敗しました'); } };
  fr.readAsText(f); e.target.value = '';
});
$('btnSave').addEventListener('click', saveJson);
$('projectName').addEventListener('input', e => { state.name = e.target.value; autosave(); });
function fileBase() { return (state.name || 'av-diagram').replace(/[\\/:*?"<>|]/g, '_') + '_' + new Date().toISOString().slice(0, 10); }
async function download(blob, name) {
  // claude.ai アーティファクト内では viewer の downloads 機能経由で保存（利用不可なら通常保存）
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const dl = await window.claude.use('downloads');
      if (dl) {
        try { await dl.save({ filename: name, data: blob }); return; }
        catch (e) { if (e && e.code === 'declined') { toast('保存をキャンセルしました'); return; } console.warn('downloads.save', e); }
      }
    }
  } catch (e) { console.warn('downloads capability', e); }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

   書き出し：PNG / PDF / PowerPoint

function exportSvgString() {
  const bb = bbox();
  const title = state.name || 'AV構成図';
  const svgStr = `<svg xmlns="http://www.w3.org/2000/svg" width="${bb.w}" height="${bb.h + 40}" viewBox="${bb.x} ${bb.y - 40} ${bb.w} ${bb.h + 40}" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif">
    <rect x="${bb.x}" y="${bb.y - 40}" width="${bb.w}" height="${bb.h + 40}" fill="#ffffff"/>
    <text x="${bb.x + 16}" y="${bb.y - 12}" font-size="18" font-weight="700" fill="#0f172a">${esc(title)}</text>
    <text x="${bb.x + bb.w - 16}" y="${bb.y - 12}" font-size="10" fill="#64748b" text-anchor="end">${new Date().toLocaleDateString('ja-JP')} · 機材 ${state.nodes.length} 台 / ケーブル ${state.conns.length} 本</text>
    ${renderConnsSvg({ export: true })}${renderNodesSvg({ export: true })}
  </svg>`;
  return { svgStr, w: bb.w, h: bb.h + 40 };
}
async function renderDiagramCanvas(scale = 2) {
  if (!state.nodes.length) throw new Error('機材が配置されていません');
  const { svgStr, w, h } = exportSvgString();
  const url = URL.createObjectURL(new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' }));
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('SVG描画に失敗')); i.src = url; });
    const cv = document.createElement('canvas'); cv.width = Math.round(w * scale); cv.height = Math.round(h * scale);
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height);
    return cv;
  } finally { URL.revokeObjectURL(url); }
}
// 表を canvas に描画（jsPDF は日本語フォント非対応のため画像化する）
function renderTableCanvases(title, headers, rows, widths, pageW = 1684, pageH = 1190) {
  const pages = [], rowH = 30, top = 110, maxRows = Math.floor((pageH - top - 60) / rowH);
  const chunks = []; for (let i = 0; i < Math.max(rows.length, 1); i += maxRows) chunks.push(rows.slice(i, i + maxRows));
  chunks.forEach((chunk, pi) => {
    const cv = document.createElement('canvas'); cv.width = pageW; cv.height = pageH; const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, pageW, pageH);
    ctx.fillStyle = '#0f172a'; ctx.font = '700 28px sans-serif'; ctx.fillText(`${title}${chunks.length > 1 ? `（${pi + 1}/${chunks.length}）` : ''}`, 60, 60);
    ctx.font = '16px sans-serif'; ctx.fillStyle = '#64748b'; ctx.textAlign = 'right'; ctx.fillText(`${state.name || ''}  ${new Date().toLocaleDateString('ja-JP')}`, pageW - 60, 60); ctx.textAlign = 'left';
    let x = 60, y = top;
    ctx.fillStyle = '#1e293b'; ctx.fillRect(60, y - 22, pageW - 120, rowH);
    ctx.fillStyle = '#fff'; ctx.font = '700 15px sans-serif';
    headers.forEach((h, i) => { ctx.fillText(h, x + 8, y); x += widths[i]; });
    y += rowH;
    ctx.font = '15px sans-serif';
    chunk.forEach((r, ri) => {
      if (ri % 2) { ctx.fillStyle = '#f1f5f9'; ctx.fillRect(60, y - 22, pageW - 120, rowH); }
      ctx.fillStyle = '#0f172a'; x = 60;
      r.forEach((cell, i) => { ctx.save(); ctx.beginPath(); ctx.rect(x, y - 22, widths[i] - 4, rowH); ctx.clip(); ctx.fillText(String(cell ?? ''), x + 8, y); ctx.restore(); x += widths[i]; });
      y += rowH;
    });
    if (!rows.length) { ctx.fillStyle = '#94a3b8'; ctx.fillText('（データなし）', 68, y); }
    pages.push(cv);
  });
  return pages;
}
function equipmentTable() { return equipmentRows().map((r, i) => [i + 1, r.cat, r.brand, r.name, r.count, r.labels.join(' / ')]); }
function cableTable() { return cableRows().map(r => [r.no, r.signal, r.cable, `${r.from} [${r.fromPort}]`, `${r.to} [${r.toPort}]`, r.length !== '' ? r.length + ' m' : '', r.note]); }

async function exportPng() {
  try { const cv = await renderDiagramCanvas(2); const b = await new Promise(r => cv.toBlob(r, 'image/png')); await download(b, `${fileBase()}.png`); toast('PNG を書き出しました'); }
  catch (e) { console.error(e); toast('⚠ ' + e.message); }
}
async function exportPdf() {
  try {
    if (!window.jspdf) throw new Error('PDFライブラリが読み込めていません（ネットワークを確認）');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4', compress: true });
    const W = 297, H = 210, m = 8;
    const cv = await renderDiagramCanvas(2);
    const k = Math.min((W - m * 2) / cv.width, (H - m * 2) / cv.height);
    pdf.addImage(cv.toDataURL('image/jpeg', 0.92), 'JPEG', (W - cv.width * k) / 2, (H - cv.height * k) / 2, cv.width * k, cv.height * k);
    const addPages = pages => pages.forEach(p => { pdf.addPage(); pdf.addImage(p.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, W, H); });
    addPages(renderTableCanvases('機材表', ['No', 'カテゴリ', 'メーカー', '機材名', '台数', 'ラベル'], equipmentTable(), [60, 180, 180, 420, 80, 640]));
    addPages(renderTableCanvases('ケーブル表（結線一覧）', ['No', '区分', 'ケーブル', 'From', 'To', '長さ', 'メモ'], cableTable(), [60, 120, 260, 390, 390, 90, 254]));
    await download(pdf.output('blob'), `${fileBase()}.pdf`);
    toast('PDF を書き出しました');
  } catch (e) { console.error(e); toast('⚠ ' + e.message); }
}
async function exportPptx() {
  try {
    if (!window.PptxGenJS) throw new Error('PowerPointライブラリが読み込めていません（ネットワークを確認）');
    if (!state.nodes.length) throw new Error('機材が配置されていません');
    const pptx = new PptxGenJS(); pptx.layout = 'LAYOUT_16x9'; // 10 x 5.625 inch
    pptx.title = state.name || 'AV構成図';
    const SW = 10, SH = 5.625;
    // --- スライド1：編集可能な図形で構成図 ---
    const s1 = pptx.addSlide();
    s1.addText(state.name || 'AV構成図', { x: 0.3, y: 0.1, w: 7, h: 0.4, fontSize: 16, bold: true, color: '0F172A' });
    s1.addText(`${new Date().toLocaleDateString('ja-JP')} · 機材 ${state.nodes.length} 台 / ケーブル ${state.conns.length} 本`, { x: 6.5, y: 0.1, w: 3.2, h: 0.4, fontSize: 8, color: '64748B', align: 'right' });
    const bb = bbox(), area = { x: 0.3, y: 0.55, w: SW - 0.6, h: SH - 0.7 };
    const k = Math.min(area.w / bb.w, area.h / bb.h);
    const X = v => area.x + (v - bb.x) * k, Y = v => area.y + (v - bb.y) * k, S = v => v * k;
    for (const n of state.nodes) {
      const g = nodeGeom(n), cat = CATEGORIES[n.def.cat] || CATEGORIES.custom;
      s1.addShape(pptx.ShapeType.roundRect, { x: X(n.x), y: Y(n.y), w: S(g.w), h: S(g.h), fill: { color: 'FFFFFF' }, line: { color: '94A3B8', width: 0.75 }, rectRadius: 0.04 });
      s1.addShape(pptx.ShapeType.rect, { x: X(n.x), y: Y(n.y), w: S(g.w), h: S(HEAD_H), fill: { color: cat.color.slice(1) }, line: { color: cat.color.slice(1), width: 0.5 } });
      if (g.photo) {
        const py = HEAD_H + 8 + Math.max(0, (g.h - HEAD_H - (g.bis.length ? (g.bis.length > 1 ? 26 : 18) : 0) - 16 - PHOTO_H) / 2);
        s1.addImage({ data: g.photo, x: X(n.x + (g.w - PHOTO_W) / 2), y: Y(n.y + py), w: S(PHOTO_W), h: S(PHOTO_H), sizing: { type: 'contain', w: S(PHOTO_W), h: S(PHOTO_H) } });
      }
      s1.addText([{ text: `${n.def.icon} ${n.label}`, options: { bold: true, fontSize: Math.max(6, S(12) * 72 / 1.1), color: 'FFFFFF', breakLine: true } }, { text: `${n.def.brand} ${n.def.name}`, options: { fontSize: Math.max(5, S(9) * 72 / 1.1), color: 'E2E8F0' } }],
        { x: X(n.x), y: Y(n.y), w: S(g.w), h: S(HEAD_H), margin: 2, valign: 'middle' });
      for (const p of n.def.ports) {
        const l = portLocal(n, p.id), color = SIGNALS[PORT_TYPES[p.type].signal].color.slice(1), used = portOccupied(n.id, p.id);
        const r = S(PORT_R);
        s1.addShape(pptx.ShapeType.ellipse, { x: X(n.x + l.x) - r, y: Y(n.y + l.y) - r, w: r * 2, h: r * 2, fill: { color: used ? color : 'FFFFFF' }, line: { color, width: 0.75 } });
        const fs = Math.max(4, S(9) * 72 / 1.1);
        if (p.dir === 'in') s1.addText(portLabel(p), { x: X(n.x + l.x) + r, y: Y(n.y + l.y) - S(ROW_H) / 2, w: S(g.w / 2), h: S(ROW_H), fontSize: fs, color: '334155', margin: 1, valign: 'middle' });
        else if (p.dir === 'out') s1.addText(portLabel(p), { x: X(n.x + l.x) - r - S(g.w / 2), y: Y(n.y + l.y) - S(ROW_H) / 2, w: S(g.w / 2), h: S(ROW_H), fontSize: fs, color: '334155', margin: 1, align: 'right', valign: 'middle' });
        else s1.addText(p.label, { x: X(n.x + l.x) - S(20), y: Y(n.y + l.y) - S(g.bis.indexOf(p) % 2 ? 27 : 18), w: S(40), h: S(12), fontSize: Math.max(3.5, fs * 0.8), color: '334155', margin: 0, align: 'center', valign: 'bottom' });
      }
    }
    for (const c of state.conns) {
      const na = state.nodes.find(n => n.id === c.a.node), nb = state.nodes.find(n => n.id === c.b.node); if (!na || !nb) continue;
      const pa = findPort(na, c.a.port); if (!pa) continue;
      const color = SIGNALS[PORT_TYPES[pa.type].signal].color.slice(1);
      const A = portWorld(na, c.a.port), B = portWorld(nb, c.b.port);
      const x1 = X(A.x), y1 = Y(A.y), x2 = X(B.x), y2 = Y(B.y);
      const lw = Math.max(Math.abs(x2 - x1), 0.01), lh = Math.max(Math.abs(y2 - y1), 0.01);
      const flipV = (x2 - x1) * (y2 - y1) < 0;
      s1.addShape(pptx.ShapeType.line, { x: Math.min(x1, x2), y: Math.min(y1, y2), w: lw, h: lh, line: { color, width: 1.5 }, flipV });
      const label = connLabel(c), mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      s1.addText(label, { x: mx - 0.45, y: my - 0.1, w: 0.9, h: 0.2, fontSize: 6, color, bold: true, align: 'center', valign: 'middle', fill: { color: 'FFFFFF' }, line: { color, width: 0.5 }, margin: 0 });
    }
    // 凡例
    const legend = Object.values(SIGNALS).map(s => ({ text: '━ ' + s.label + '  ', options: { color: s.color.slice(1), bold: true, fontSize: 7 } }));
    s1.addText(legend, { x: 0.3, y: SH - 0.25, w: 8, h: 0.2, margin: 0 });
    // --- スライド2：画像版（高忠実度） ---
    const cv = await renderDiagramCanvas(2);
    const s2 = pptx.addSlide();
    const ik = Math.min((SW - 0.4) / cv.width, (SH - 0.4) / cv.height);
    s2.addImage({ data: cv.toDataURL('image/png'), x: (SW - cv.width * ik) / 2, y: (SH - cv.height * ik) / 2, w: cv.width * ik, h: cv.height * ik });
    // --- スライド3・4：機材表・ケーブル表 ---
    const tableOpts = { x: 0.3, y: 0.6, w: SW - 0.6, fontSize: 9, border: { type: 'solid', pt: 0.5, color: 'CBD5E1' }, autoPage: true, autoPageRepeatHeader: true, colW: null };
    const hdr = cells => cells.map(t => ({ text: t, options: { bold: true, color: 'FFFFFF', fill: { color: '1E293B' } } }));
    const s3 = pptx.addSlide();
    s3.addText('機材表', { x: 0.3, y: 0.1, w: 5, h: 0.4, fontSize: 16, bold: true });
    s3.addTable([hdr(['No', 'カテゴリ', 'メーカー', '機材名', '台数', 'ラベル'])].concat(equipmentTable().map(r => r.map(String))), { ...tableOpts, colW: [0.4, 1.2, 1.2, 2.6, 0.6, 3.4] });
    const s4 = pptx.addSlide();
    s4.addText('ケーブル表（結線一覧）', { x: 0.3, y: 0.1, w: 5, h: 0.4, fontSize: 16, bold: true });
    s4.addTable([hdr(['No', '区分', 'ケーブル', 'From', 'To', '長さ', 'メモ'])].concat(cableTable().map(r => r.map(String))), { ...tableOpts, colW: [0.4, 0.8, 1.6, 2.4, 2.4, 0.6, 1.2] });
    const pptxBlob = await pptx.write({ outputType: 'blob' });
    await download(pptxBlob, `${fileBase()}.pptx`);
    toast('PowerPoint を書き出しました');
  } catch (e) { console.error(e); toast('⚠ ' + e.message); }
}

    if (!spec.length) { toast('端子を1つ以上追加してください'); return; }

function openModal(title, html) { $('modalTitle').textContent = title; $('modalBody').innerHTML = html; $('modal').classList.remove('hidden'); }
function closeModal() { $('modal').classList.add('hidden'); }

let toastTimer;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hidden'), 3200); console.log('toast:', msg); }
function mdToHtml(md) {
  return md.split('\n').map(l => {
    if (l.startsWith('## ')) return `<h2>${esc(l.slice(3))}</h2>`;
    if (l.startsWith('### ')) return `<h3>${esc(l.slice(4))}</h3>`;
    if (l.startsWith('- ')) return `<li>${esc(l.slice(2)).replace(/`([^`]+)`/g, '<code>$1</code>')}</li>`;
    if (!l.trim()) return '';
    return `<p>${esc(l).replace(/`([^`]+)`/g, '<code>$1</code>')}</p>`;
  }).join('\n').replace(/(<li>[\s\S]*?<\/li>\n?)+/g, m => `<ul>${m}</ul>`);
}
$('btnVersion').addEventListener('click', () => openModal('リリースノート', mdToHtml(RELEASE_NOTES)));
$('btnHelp').addEventListener('click', () => openModal('使い方 — AV構成図シミュレーター', mdToHtml(`## これは何？
映像配信・イベント現場の機材構成図（結線図）を、機材をドラッグして端子同士を繋ぐだけで作れるツールです。
機材ごとの端子数・種類はメーカー仕様に合わせてあり、繋がらない端子は物理的に繋げないようになっています。

## 基本操作
- 左パレットの機材を **クリック** するとキャンバス中央に配置、**ドラッグ＆ドロップ** で好きな位置に配置
- 機材本体をドラッグで移動（10px グリッドに吸着）
- 端子（○）からドラッグして相手の端子へ。接続できる端子は太く表示され、近づくと **マグネットのように吸着** します
- 機材を **ダブルクリック** でラベル変更（例：C-1 / スライドPC）
- 背景をドラッグでパン、マウスホイールでズーム、「全体表示」で全体をフィット
- \`Delete\` 削除 / \`Ctrl+Z\` 元に戻す / \`Ctrl+D\` 複製 / \`Ctrl+S\` JSON保存 / \`Esc\` 選択解除

## 接続ルール
- 同じ種類の端子同士のみ接続可（HDMI↔HDMI、SDI↔SDI、LAN↔LAN …）
- 出力→入力の向きのみ（出力同士・入力同士は不可）
- XLR（キャノン）は 入力=メス(♀)、出力=オス(♂)。オス同士・メス同士は繋がりません
- 1つの端子には1本のケーブルのみ
- 異なる端子種を繋ぐには「変換」機材（ステレオミニ→XLR、HDMI→SDI 等）を間に入れます

## 線の色
- 青：映像（HDMI / SDI / 同軸）
- 緑：音声（XLR / TRS / RCA / ステレオミニ）
- オレンジ：ネットワーク（LAN）
- 紫：USB / データ
- グレー：制御（MIDI / TALLY / RS-422）

## 保存・書き出し
- **JSON保存 / 読込**：作業データをファイルに保存。ブラウザにも自動保存されます
- **PNG**：構成図の画像
- **PDF**：構成図 + 機材表 + ケーブル表（A4横）
- **PowerPoint**：図形として編集できる構成図スライド + 画像版 + 機材表 + ケーブル表

## 配置した機材の編集
機材を選択すると右パネルで **メーカー・機材名・役割ラベル・メモ** を編集できます。
端子も **種別 / 向き / ラベル** を変更でき、「＋ 端子追加」「✕」で増減できます（種別や向きを変えると、その端子のケーブルは外れます）。
編集した構成は「パレットに保存」でカスタム機材として再利用できます。

## 写真モード
ヘッダーの「🖼 写真モード」で、機材ボックスを実機写真に切り替えます。V-8HD / V-1HD+ / V-02HD / Video Assist / DCE-U1 / GY-HM250 / HDMIスプリッター / ノートPC などは写真を内蔵しています。
機材ごとに「📷 写真を選ぶ」で自分の写真に差し替えられます（縮小して JSON にも保存されます）。

## カスタム機材
パレットに無い機材は「カスタム機材を作成」から端子構成を指定して登録できます。登録した機材はブラウザに保存され、JSONにも含まれます。

## 機材データについて
端子構成はメーカー公開仕様をもとに作成しています（Roland V-8HD / V-1HD+ / V-02HD MK II / VR-1HD / V-160HD、Blackmagic ATEM Mini Pro / Extreme、Video Assist 7" 12G、IMAGENICS DCE-U1 など）。
実機と差異がある場合はカスタム機材で調整してください。`)));

  const link = (na, la, nb, lb, len) => {
    const pa = na.def.ports.find(p => p.label === la && !portOccupied(na.id, p.id)), pb = nb.def.ports.find(p => p.label === lb && !portOccupied(nb.id, p.id));
    if (!pa || !pb) { console.warn('sample link failed', la, lb); return; }
    const r = checkCompat(na, pa, nb, pb); if (!r.ok) { console.warn('sample compat', r.msg); return; }
    state.conns.push({ id: uid(), a: { node: na.id, port: pa.id }, b: { node: nb.id, port: pb.id }, length: len || null, note: '' });

  link(rx, 'HDMI OUT', sw, 'HDMI IN 2', 1);

  link(pcZoomVideo, 'HDMI OUT', sw, 'HDMI IN 4', 3);

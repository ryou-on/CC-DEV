<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hihaho 2026年9月 プロダクトアップデート</title>
<style>
  html, body { margin: 0; background: #043348; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* ============================================================
   hihaho 2026年9月 プロダクトアップデート — 文字中心モーショングラフィック（84秒）
   出典: https://hihaho.com/blog/hihaho-product-update-september-2026-five-new-features-to-make-your-interactive-videos-even-better/
   全ての描画は seek(t) の純粋関数。BPM120 → 1拍 = 0.5秒、84秒 = 168拍
   構成: イントロ12拍 / 新機能5本 × 28拍 / アウトロ16拍
   ============================================================ */
const COLOR = {
  navy: '#043348', light: '#f6f8fa', muted: '#5d7482', white: '#ffffff',
  pink: '#fb1a7c', cyan: '#2ed6e3', green: '#2cae6c', orange: '#fba37c',
};
const FEATURES = [
  { name: 'AIフィードバック＆コーチング', head: ['AIが、その場で', 'フィードバック。'],
    lines: ['自由記述の回答に、一人ひとりへ即フィードバック', '追加の質問で、正解へ導く', '回答を手作業で確認する必要はなし'],
    color: COLOR.pink, ink: COLOR.white },
  { name: 'テキスト読み上げ', head: ['マイクなしで、', 'ナレーションを。'],
    lines: ['Soundインタラクションにテキストを入力するだけ', '修正は、文章を直して再生成', '録り直しも音声編集も不要'],
    color: COLOR.cyan, ink: COLOR.navy },
  { name: '翻訳コピー', head: ['1本の動画で、', '多言語に届ける。'],
    lines: ['インタラクションの翻訳コピーを数クリックで作成', '言語ごとに動画を作り直さない', 'メッセージは一貫したまま'],
    color: COLOR.green, ink: COLOR.white },
  { name: 'インタラクショングループ', head: ['複雑な動画も、', 'すっきり整理。'],
    lines: ['ボタン・質問・ホットスポット・メニューをまとめる', '色分けで、全体がひと目でわかる', '要素が増えても迷わない'],
    color: COLOR.orange, ink: COLOR.navy },
  { name: 'サムネイル管理', head: ['最初の1枚を、', 'いつでも差し替え。'],
    lines: ['スタジオのサムネイル欄から追加・変更', '再生したくなる1枚を、後からでも'],
    color: COLOR.navy, ink: COLOR.white },
];
const LANGS = ['JP', 'EN', 'DE', 'FR', 'NL', 'ES', 'PT', 'DK', '中文', 'RU'];
const FONT = '"Noto Sans JP","Noto Sans CJK JP","Hiragino Sans","Yu Gothic","IPAGothic","Meiryo",sans-serif';
const BPM = 120, BEAT = 60 / BPM;
const INTRO = 12, FEAT = 28, OUTRO_AT = INTRO + FEAT * 5;      // 12 / 28 / 152 拍
window.DURATION = 84;
const W = 1920, H = 1080;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const LOGO = Object.assign(new Image(), { src: 'logo-primary.png' });
window.READY = Promise.all([
  new Promise(r => { LOGO.onload = r; LOGO.onerror = r; }),
  document.fonts ? document.fonts.ready : Promise.resolve(),
]);

/* ---------- イージング・ヘルパー ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (b, s, d) => clamp((b - s) / d);
const outCubic = x => 1 - Math.pow(1 - x, 3);
const outExpo = x => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const inOutCubic = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const outBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
let T = 0;                                                      // 現在の絶対秒（波形・ゆらぎ用）

function setFont(size, weight = 700) { ctx.font = `${weight} ${size}px ${FONT}`; ctx.textBaseline = 'alphabetic'; }
function fillBg(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function fillRR(x, y, w, h, r, fill, stroke, lw = 4) {
  rr(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function sk(x, y, w, h, color) { fillRR(x, y, Math.max(0, w), h, h / 2, color); }   // スケルトン行
function popAt(cx, cy, p, fn) {                                  // 中心基準でバウンド登場
  if (p <= 0) return;
  ctx.save(); ctx.translate(cx, cy);
  const s = Math.max(0.0001, outBack(p)); ctx.scale(s, s); ctx.translate(-cx, -cy);
  ctx.globalAlpha = clamp(p * 3); fn(); ctx.restore();
}
function star(cx, cy, r, color) {                                // 4点スパークル
  ctx.beginPath(); ctx.moveTo(cx, cy - r);
  ctx.quadraticCurveTo(cx, cy, cx + r, cy); ctx.quadraticCurveTo(cx, cy, cx, cy + r);
  ctx.quadraticCurveTo(cx, cy, cx - r, cy); ctx.quadraticCurveTo(cx, cy, cx, cy - r);
  ctx.fillStyle = color; ctx.fill();
}
// マスク付きせり上がり文字（maxW 指定で自動縮小）
function maskedText(text, x, baseY, size, p, color, align = 'left', maxW = 0) {
  if (p <= 0) return;
  setFont(size);
  let s = size;
  if (maxW) { const w = ctx.measureText(text).width; if (w > maxW) { s = size * maxW / w; setFont(s); } }
  ctx.textAlign = align; ctx.fillStyle = color;
  const lineH = s * 1.3;
  ctx.save(); ctx.beginPath(); ctx.rect(0, baseY - s * 1.05, W, lineH); ctx.clip();
  ctx.fillText(text, x, baseY + (1 - outExpo(p)) * lineH);
  ctx.restore();
}
function bar(x, y, w, h, p, color) { ctx.fillStyle = color; ctx.fillRect(x, y, w * outExpo(p), h); }
function logoAt(cx, cy, w, wipeP) {                              // 中央から左右にワイプ
  const h = w * LOGO.height / LOGO.width;
  ctx.save(); ctx.beginPath();
  ctx.rect(cx - (w / 2) * wipeP - 2, cy - h, w * wipeP + 4, h * 2); ctx.clip();
  ctx.drawImage(LOGO, cx - w / 2, cy - h / 2, w, h); ctx.restore();
}

/* ---------- 共通クローム（ロゴ・進行インジケータ） ---------- */
function chrome(fi) {
  logoAt(160 + 118, 88, 236, 1);
  const x0 = W - 160 - 5 * 70 + 10;
  setFont(30, 700); ctx.textAlign = 'right'; ctx.fillStyle = COLOR.muted;
  ctx.fillText(`0${fi + 1} / 05`, x0 - 24, 100);
  for (let i = 0; i < 5; i++) {
    ctx.fillStyle = i === fi ? FEATURES[i].color : (i < fi ? COLOR.muted : '#d3dce2');
    ctx.fillRect(x0 + i * 70, 84, 60, 12);
  }
}

/* ---------- 各機能のモチーフ ---------- */
function motif1(lb) {                                            // AIフィードバック：吹き出しのやり取り
  popAt(1500, 385, prog(lb, 8, 1.2), () => {
    fillRR(1240, 320, 520, 130, 28, COLOR.navy);
    sk(1272, 350, 380, 16, 'rgba(255,255,255,.9)'); sk(1272, 384, 300, 16, 'rgba(255,255,255,.7)'); sk(1272, 418, 200, 16, 'rgba(255,255,255,.5)');
  });
  if (lb > 11 && lb < 13.4) {                                    // 入力中ドット
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(1210 + i * 38, 520 - Math.abs(Math.sin(T * 6 + i * 0.8)) * 14, 12, 0, 7); ctx.fillStyle = COLOR.pink; ctx.fill(); }
  }
  popAt(1460, 575, prog(lb, 13, 1.2), () => {
    fillRR(1180, 490, 560, 170, 28, '#ffe3ef', COLOR.pink, 5);
    star(1236, 550, 26 + Math.sin(T * 5) * 3, COLOR.pink);
    sk(1290, 530, 380, 16, 'rgba(251,26,124,.55)'); sk(1290, 564, 300, 16, 'rgba(251,26,124,.4)'); sk(1290, 598, 220, 16, 'rgba(251,26,124,.3)');
  });
  popAt(1390, 755, prog(lb, 17, 1.2), () => {
    fillRR(1180, 700, 420, 110, 28, COLOR.white, COLOR.pink, 5);
    setFont(76, 900); ctx.textAlign = 'center'; ctx.fillStyle = COLOR.pink; ctx.fillText('?', 1238, 780);
    sk(1290, 738, 250, 16, 'rgba(4,51,72,.35)'); sk(1290, 772, 170, 16, 'rgba(4,51,72,.25)');
  });
}
function motif2(lb) {                                            // テキスト読み上げ：入力→波形
  popAt(1255, 326, prog(lb, 8, 1.1), () => { fillRR(1180, 300, 150, 52, 26, COLOR.navy); setFont(28); ctx.textAlign = 'center'; ctx.fillStyle = COLOR.white; ctx.fillText('Sound', 1255, 337); });
  const fp = prog(lb, 8.5, 1);
  ctx.save(); ctx.globalAlpha = fp; fillRR(1180, 370, 580, 120, 18, COLOR.white, COLOR.navy, 4);
  sk(1212, 410, 480 * outCubic(prog(lb, 9, 2)), 16, 'rgba(4,51,72,.8)'); sk(1212, 448, 340 * outCubic(prog(lb, 11, 2)), 16, 'rgba(4,51,72,.6)');
  if (Math.floor(T * 2.5) % 2 === 0 && lb < 14) { ctx.fillStyle = COLOR.cyan; ctx.fillRect(1212 + 340 * outCubic(prog(lb, 11, 2)) + 8, 442, 6, 28); }
  ctx.restore();
  const ap = prog(lb, 13, 0.8);
  if (ap > 0) { ctx.save(); ctx.globalAlpha = ap; ctx.translate(0, Math.sin(T * 5) * 4); ctx.beginPath(); ctx.moveTo(1450, 528); ctx.lineTo(1490, 528); ctx.lineTo(1470, 560); ctx.closePath(); ctx.fillStyle = COLOR.cyan; ctx.fill(); ctx.restore(); }
  const env = outCubic(prog(lb, 14, 1.5));
  for (let i = 0; i < 29; i++) {
    const amp = 0.35 + 0.65 * Math.abs(Math.sin(i * 0.21));
    const h = 14 + 120 * env * Math.abs(Math.sin(i * 0.55 + T * 3)) * amp;
    fillRR(1182 + i * 20, 660 - h / 2, 12, h, 6, i % 7 === 3 ? COLOR.navy : COLOR.cyan);
  }
  popAt(1660, 790, prog(lb, 19, 1.1), () => { fillRR(1560, 760, 200, 64, 32, COLOR.cyan); setFont(34); ctx.textAlign = 'center'; ctx.fillStyle = COLOR.navy; ctx.fillText('再生成', 1660, 803); });
}
function motif3(lb) {                                            // 翻訳コピー：1本から多言語へ
  popAt(1460, 395, prog(lb, 8, 1.2), () => {
    fillRR(1270, 290, 380, 214, 22, COLOR.navy);
    ctx.beginPath(); ctx.moveTo(1432, 360); ctx.lineTo(1432, 434); ctx.lineTo(1496, 397); ctx.closePath(); ctx.fillStyle = COLOR.white; ctx.fill();
  });
  const cw = 108, ch = 72, gap = 12, x0 = 1450 - (5 * cw + 4 * gap) / 2;
  LANGS.forEach((lg, i) => {
    const col = i % 5, row = Math.floor(i / 5), x = x0 + col * (cw + gap), y = 570 + row * (ch + gap);
    const p = prog(lb, 10 + i * 0.7, 1);
    if (p > 0) { ctx.save(); ctx.globalAlpha = 0.35 * clamp(p * 2); ctx.strokeStyle = COLOR.green; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(1460, 504); ctx.lineTo(x + cw / 2, y); ctx.stroke(); ctx.restore(); }
    popAt(x + cw / 2, y + ch / 2, p, () => {
      fillRR(x, y, cw, ch, 20, i === 0 ? COLOR.navy : '#d8f3e4', i === 0 ? null : COLOR.green, 3);
      setFont(34, 900); ctx.textAlign = 'center'; ctx.fillStyle = i === 0 ? COLOR.white : COLOR.navy; ctx.fillText(lg, x + cw / 2, y + 48);
    });
  });
}
function motif4(lb) {                                            // インタラクショングループ：散らばりを整理
  const GC = [COLOR.pink, COLOR.cyan, COLOR.green], gy = [330, 490, 650];
  const frames = prog(lb, 15, 1.2);
  GC.forEach((c, g) => {
    const p = clamp(frames - g * 0.0); if (p <= 0) return;
    ctx.save(); ctx.globalAlpha = outCubic(p); ctx.translate(0, (1 - outExpo(prog(lb, 15 + g * 0.5, 1.2))) * 30);
    fillRR(1150, gy[g], 620, 130, 22, c + '22', c, 6); ctx.restore();
  });
  const NAMES = ['ボタン', '質問', 'ホットスポット', 'メニュー'];
  const S = [[1180, 320], [1520, 360], [1650, 520], [1200, 560], [1420, 470], [1560, 700], [1250, 740], [1690, 330], [1400, 640]];
  for (let i = 0; i < 9; i++) {
    const g = Math.floor(i / 3), k = i % 3;
    const tx = 1170 + k * 195, ty = gy[g] + 25;
    const m = inOutCubic(prog(lb, 12 + i * 0.25, 3));
    const x = S[i][0] + (tx - S[i][0]) * m, y = S[i][1] + (ty - S[i][1]) * m + Math.sin(T * 2 + i) * 8 * (1 - m);
    popAt(x + 85, y + 40, prog(lb, 8 + i * 0.4, 1), () => {
      fillRR(x, y, 170, 80, 18, COLOR.white, m > 0.85 ? GC[g] : COLOR.navy, 4);
      setFont(26); ctx.textAlign = 'center'; ctx.fillStyle = COLOR.navy;
      const nm = NAMES[i % 4]; let s = 26; if (ctx.measureText(nm).width > 140) s = 26 * 140 / ctx.measureText(nm).width; setFont(s);
      ctx.fillText(nm, x + 85, y + 50);
    });
  }
}
function motif5(lb) {                                            // サムネイル管理：1枚を差し替え
  const fx = 1190, fy = 330, fw = 520, fh = 292;
  popAt(fx + fw / 2, fy + fh / 2, prog(lb, 8, 1.2), () => {
    ctx.save(); rr(fx, fy, fw, fh, 24); ctx.clip();
    const sw = inOutCubic(prog(lb, 13, 1.5));
    const thumb = (dx, fill) => {
      ctx.fillStyle = fill; ctx.fillRect(fx + dx, fy, fw, fh);
      ctx.beginPath(); ctx.arc(fx + dx + fw / 2, fy + fh / 2 - 10, 54, 0, 7); ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.fill();
      ctx.beginPath(); ctx.moveTo(fx + dx + fw / 2 - 16, fy + fh / 2 - 42); ctx.lineTo(fx + dx + fw / 2 - 16, fy + fh / 2 + 22); ctx.lineTo(fx + dx + fw / 2 + 32, fy + fh / 2 - 10); ctx.closePath(); ctx.fillStyle = COLOR.navy; ctx.fill();
      sk(fx + dx + 40, fy + fh - 52, 260, 14, 'rgba(255,255,255,.7)');
    };
    thumb(-sw * fw, COLOR.orange); thumb((1 - sw) * fw, COLOR.pink);
    ctx.restore();
    rr(fx, fy, fw, fh, 24); ctx.strokeStyle = COLOR.navy; ctx.lineWidth = 6; ctx.stroke();
  });
  const press = prog(lb, 12, 0.6), sc = 1 - 0.06 * Math.sin(press * Math.PI);
  popAt(fx + 150, 708, prog(lb, 9.5, 1), () => {
    ctx.save(); ctx.translate(fx + 150, 708); ctx.scale(sc, sc); ctx.translate(-(fx + 150), -708);
    fillRR(fx, 670, 300, 76, 38, COLOR.navy); setFont(34); ctx.textAlign = 'center'; ctx.fillStyle = COLOR.white; ctx.fillText('差し替え', fx + 150, 718); ctx.restore();
  });
  popAt(fx + 410, 708, prog(lb, 10.2, 1), () => { fillRR(fx + 320, 670, 200, 76, 38, null, COLOR.navy, 4); setFont(34); ctx.textAlign = 'center'; ctx.fillStyle = COLOR.navy; ctx.fillText('追加', fx + 420, 718); });
  const rp = prog(lb, 12.2, 1.2);
  if (rp > 0 && rp < 1) { ctx.save(); ctx.globalAlpha = 0.5 * (1 - rp); ctx.strokeStyle = COLOR.pink; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(fx + 150, 708, 40 + 120 * outCubic(rp), 0, 7); ctx.stroke(); ctx.restore(); }
}
const MOTIFS = [motif1, motif2, motif3, motif4, motif5];

/* ---------- シーン ---------- */
function intro(b) {                                              // 0〜12拍（以降は保持）
  fillBg(COLOR.light);
  logoAt(960, 270, 860, outExpo(prog(b, 0.5, 2.5)));
  maskedText('プロダクトアップデート', 960, 560, 72, prog(b, 3, 1.2), COLOR.muted, 'center');
  maskedText('2026年9月', 960, 790, 200, prog(b, 4, 1.4), COLOR.navy, 'center');
  bar(960 - 300, 830, 600, 14, prog(b, 6, 1.5), COLOR.pink);
  popAt(960, 930, prog(b, 7.5, 1.2), () => {
    fillRR(960 - 190, 880, 380, 96, 48, COLOR.pink); setFont(54); ctx.textAlign = 'center'; ctx.fillStyle = COLOR.white; ctx.fillText('新機能 5つ', 960, 946);
  });
}
function featureContent(fi, lb) {                                // lb は 28 超でも最終状態を保持
  const F = FEATURES[fi];
  fillBg(COLOR.light);
  chrome(fi);
  maskedText(F.head[0], 160, 440, 96, prog(lb, 6.2, 1.2), COLOR.navy, 'left', 900);
  maskedText(F.head[1], 160, 560, 96, prog(lb, 6.8, 1.2), COLOR.navy, 'left', 900);
  bar(160, 596, 160, 14, prog(lb, 9, 1.2), F.color === COLOR.navy ? COLOR.pink : F.color);
  F.lines.forEach((ln, i) => {
    const s = 10 + i * 4;
    ctx.fillStyle = F.color === COLOR.navy ? COLOR.pink : F.color;
    ctx.globalAlpha = outCubic(prog(lb, s, 0.8)); ctx.fillRect(160, 700 + i * 76 - 24, 16, 16); ctx.globalAlpha = 1;
    maskedText(ln, 200, 700 + i * 76, 38, prog(lb, s, 1.2), COLOR.navy, 'left', 880);
  });
  MOTIFS[fi](lb);
}
function chapterCard(fi, lb) {                                   // 章扉：アクセント色の全面カード
  const F = FEATURES[fi];
  let y = 0;
  if (lb < 1.2) y = (1 - inOutCubic(lb / 1.2)) * H;
  else if (lb > 4.6) y = -inOutCubic(prog(lb, 4.6, 1.2)) * H;
  if (lb > 5.8) return;
  ctx.save(); ctx.translate(0, y);
  fillBg(F.color);
  if ('letterSpacing' in ctx) ctx.letterSpacing = '8px';
  maskedText(`FEATURE 0${fi + 1} / 05`, 160, 200, 40, prog(lb, 1.2, 1), F.ink, 'left');
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  maskedText(`0${fi + 1}`, 140, 720, 560, prog(lb, 1.2, 1.3), F.ink, 'left');
  maskedText(F.name, 160, 900, 92, prog(lb, 2, 1.3), F.ink, 'left', 1600);
  ctx.restore();
}
function outro(o) {
  if (o < 1.2) featureContent(4, FEAT + o);
  else if (o >= 8) {                                             // 白背景のエンドカード
    fillBg(COLOR.light);
    logoAt(960, 380, 860, outExpo(prog(o, 8.8, 1.8)));
    maskedText('hihaho.com', 960, 700, 110, prog(o, 10.2, 1.3), COLOR.navy, 'center');
    bar(960 - 260, 740, 520, 14, prog(o, 11.5, 1.5), COLOR.pink);
    ctx.save(); ctx.globalAlpha = outCubic(prog(o, 12.5, 1.5));
    setFont(28, 500); ctx.textAlign = 'center'; ctx.fillStyle = COLOR.muted;
    ctx.fillText('出典: hihaho Product Update September 2026（2026年9月29日）', 960, 960); ctx.restore();
  }
  let y = 0;
  if (o < 1.2) y = (1 - inOutCubic(o / 1.2)) * H;
  else if (o >= 8) y = -inOutCubic(prog(o, 8, 1.2)) * H;
  if (o > 9.2) return;
  ctx.save(); ctx.translate(0, y);
  fillBg(COLOR.navy);
  maskedText('今月の新機能', 240, 170, 52, prog(o, 0.8, 1), COLOR.cyan, 'left');
  FEATURES.forEach((F, i) => {
    const p = prog(o, 1.4 + i * 0.9, 1.1), by = 330 + i * 130;
    maskedText(`0${i + 1}`, 240, by, 72, p, F.color === COLOR.navy ? COLOR.pink : F.color, 'left');
    maskedText(F.name, 400, by, 76, p, COLOR.white, 'left', 1320);
  });
  ctx.restore();
}

/* ---------- メイン：時刻 t のフレームを描画 ---------- */
window.seek = function (t) {
  T = t;
  const b = t / BEAT;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  if (b >= OUTRO_AT) outro(b - OUTRO_AT);
  else if (b >= INTRO) {
    const fi = Math.floor((b - INTRO) / FEAT), lb = b - INTRO - fi * FEAT;
    if (lb < 1.2) { if (fi === 0) intro(INTRO + lb); else featureContent(fi - 1, FEAT + lb); }
    if (lb >= 5.8 || lb >= 0) { if (lb >= 1.2) featureContent(fi, lb); }
    chapterCard(fi, lb);
  } else intro(b);
  const fade = prog(t, 83.5, 0.5);                                // 最後0.5秒でフェードアウト
  if (fade > 0) { ctx.fillStyle = `rgba(246,248,250,${fade})`; ctx.fillRect(0, 0, W, H); }
};

// ブラウザで開いた場合は実時間で再生プレビュー（書き出しには影響しない）
window.READY.then(() => {
  if (!navigator.webdriver) {
    const t0 = performance.now();
    const loop = () => { window.seek(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    loop();
  } else { window.seek(0); }
});
</script>
</body>
</html>

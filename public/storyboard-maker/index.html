// 画像ファイル → 長辺1280pxのJPEG dataURL
function fileToDataUrl(file, maxSide = 1280) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const r = Math.min(1, maxSide / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
        x.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.86));
      };
      img.onerror = () => reject(new Error('画像を読み込めませんでした'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

// SVG文字列 → JPEG dataURL
function svgToJpeg(svg, w, h) {
  if (!/xmlns=/.test(svg)) svg = svg.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
      x.drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/jpeg', 0.9));
    };
    img.onerror = () => reject(new Error('AIが出力したSVGを描画できませんでした'));
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}

// ===== Markdown パーサー =====
const FIELD_ALIASES = [
  ['action', /^(画|絵|映像|内容|ト書き?|text|picture|action|描写|説明|アクション)$/i],
  ['camera', /^(カメラ|camera|cam|カメラワーク|アングル)$/i],
  ['dialogue', /^(セリフ|台詞|script|dialogue|ナレーション|NA|テロップ|字幕|せりふ)$/i],
  ['sound', /^(音|SE|BGM|sound|効果音|音楽|MA|音響)$/i],
  ['duration', /^(秒|秒数|尺|time|duration|時間)$/i],
  ['note', /^(メモ|note|notes|備考)$/i],
  ['scene', /^(シーン|scene|場所|場面|柱)$/i],
];
const fieldKey = label => { const l = String(label).replace(/[*_`]/g, '').trim(); for (const [k, re] of FIELD_ALIASES) if (re.test(l)) return k; return null; };
const parseDuration = s => { const m = String(s).match(/(\d+(?:\.\d+)?)/); return m ? parseFloat(m[1]) : null; };
const cleanScene = s => s.replace(/^(シーン|scene)\s*[:：]\s*/i, '').replace(/^—$/, '').trim();
const appendField = (cut, key, val) => { if (!val) return; cut[key] = cut[key] ? cut[key] + '\n' + val : val; };

function splitRow(row) { return row.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(s => s.trim().replace(/<br\s*\/?>/gi, '\n')); }

function readTable(lines, start) {
  const head = splitRow(lines[start]);
  const keys = head.map(h => /^(no\.?|#|cut|カット|番号|c)$/i.test(h.replace(/[*_]/g, '')) ? 'no' : fieldKey(h));
  const rows = [];
  let i = start + 2;
  for (; i < lines.length && lines[i].trim().startsWith('|'); i++) {
    const cells = splitRow(lines[i]); const cut = {};
    cells.forEach((v, ci) => {
      if (!v) return;
      const k = keys[ci];
      if (k === 'no') return;
      if (k === 'duration') { const d = parseDuration(v); if (d) { cut.duration = d; cut._dur = true; } return; }
      if (k) appendField(cut, k, v); else appendField(cut, 'note', `${head[ci] || '列' + (ci + 1)}: ${v}`);
    });
    if (Object.keys(cut).length) rows.push(cut);
  }
  return { rows, end: i - 1 };
}

function startCut(label, sceneMode) {
  const cut = {};
  let s = label.trim();
  const dm = s.match(/[（(]\s*(\d+(?:\.\d+)?)\s*(秒|s|sec)\s*[)）]/i) || s.match(/[|｜]\s*(\d+(?:\.\d+)?)\s*(秒|s|sec)?\s*$/i) || s.match(/\s(\d+(?:\.\d+)?)\s*(秒|sec)\s*$/i);
  if (dm) { cut.duration = parseFloat(dm[1]); cut._dur = true; s = s.replace(dm[0], ''); }
  if (sceneMode) { cut.scene = cleanScene(s); return cut; }
  s = s.replace(/^(cut|カット|c|#)\s*[-#.]?\s*\d+/i, '').replace(/^[\s:：|｜\-—]+/, '').trim();
  if (s) cut.action = s;
  return cut;
}

function applyBodyLine(cut, raw) {
  let t = raw.replace(/^\s*([-*+]|\d+[.)])\s+/, '').trim();
  if (!t) return;
  const kv = t.match(/^\**([^:：「『]{1,12}?)\**\s*[:：]\s*(.*)$/);
  if (kv && fieldKey(kv[1])) {
    const k = fieldKey(kv[1]);
    if (k === 'duration') { const d = parseDuration(kv[2]); if (d) { cut.duration = d; cut._dur = true; } }
    else if (k === 'scene') cut.scene = cleanScene(kv[2]);
    else appendField(cut, k, kv[2].trim());
    return;
  }
  if (/^[^\s「『]{1,15}[「『]/.test(t)) { appendField(cut, 'dialogue', t); return; }
  if (/^[「『]/.test(t)) { appendField(cut, 'dialogue', t); return; }
  if (/^(SE|BGM|M)\b|^♪/.test(t)) { appendField(cut, 'sound', t); return; }
  appendField(cut, 'action', t);
}

// md → { title, cuts }
function parseMarkdown(text) {
  const lines = text.replace(/\r\n?/g, '\n').split('\n');
  const hasH3 = lines.some(l => /^###\s+/.test(l.trim()));
  let title = '', scene = '', cur = null, pending = {}; const cuts = [];
  const push = c => { const cut = newCut({ scene, ...c }); cuts.push(cut); return cut; };
  for (let i = 0; i < lines.length; i++) {
    const t = lines[i].trim();
    if (!t || /^(---|\*\*\*|___)$/.test(t)) continue;
    let m;
    // テーブル形式
    if (t.startsWith('|') && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
      const { rows, end } = readTable(lines, i);
      rows.forEach(r => push(r)); i = end; cur = null; continue;
    }
    if ((m = t.match(/^#\s+(.+)/))) { if (!title) title = m[1].trim(); else scene = cleanScene(m[1]); cur = null; continue; }
    if ((m = t.match(/^##\s+(.+)/))) {
      if (hasH3) { scene = cleanScene(startCut(m[1], true).scene || ''); cur = null; }
      else { const c = startCut(m[1], true); scene = c.scene || scene; pending = c._dur ? { duration: c.duration, _dur: true } : {}; cur = null; }
      continue;
    }
    if ((m = t.match(/^#{3,6}\s+(.+)/))) { cur = push(startCut(m[1], false)); continue; }
    if (t.startsWith('>')) continue; // 引用はメタ情報として無視
    if (!cur) {
      // シーン見出しの下の箇条書き＝1行1カット（シーン割り形式）
      if (/^\s*([-*+]|\d+[.)])\s+/.test(lines[i]) && scene) { const c = {}; applyBodyLine(c, lines[i]); if (c.scene !== undefined) { scene = c.scene; continue; } push(c); continue; }
      if (scene || title) { cur = push(pending); pending = {}; applyBodyLine(cur, lines[i]); }
      continue;
    }
    applyBodyLine(cur, lines[i]);
  }
  // セリフ量から秒数を補完（明示されていない場合）
  cuts.forEach(c => { if (c._dur) { delete c._dur; return; } if (c.dialogue) { const len = c.dialogue.replace(/[^「」『』]*[「『]|[」』]/g, '').length; c.duration = Math.max(2, Math.round((len / 6 + 1) * 2) / 2); } });
  return { title, cuts };
}

// プロジェクト → md
function toMarkdown(p) {
  const total = p.cuts.reduce((a, c) => a + (+c.duration || 0), 0);
  const out = [`# ${p.title}`, '', `> アスペクト比: ${p.aspect} / カット数: ${p.cuts.length} / 総尺: ${fmtTC(total)}（${total}秒）`, ''];
  let scene = null;
  p.cuts.forEach((c, i) => {
    if (c.scene !== scene) { scene = c.scene; out.push(`## ${scene || '—'}`, ''); }
    out.push(`### CUT ${cutNo(i)} (${+c.duration || 0}秒)`);
    const put = (label, v) => { if (v) String(v).split('\n').forEach(l => out.push(`- ${label}: ${l}`)); };
    put('画', c.action); put('カメラ', c.camera); put('セリフ', c.dialogue); put('音', c.sound); put('メモ', c.note);
    if (c.image) out.push(`- メモ: （絵あり：JSON書き出しに含まれます）`);
    out.push('');
  });
  return out.join('\n');
}

// ===== Claude API（Cloud Functions 経由。APIキーはサーバー側にのみ存在） =====
const API_ENDPOINT = 'https://asia-northeast1-cc-dev-ps7.cloudfunctions.net/askClaude';
const JPY_PER_USD = 150;
const ROUGH_COST_USD = { rough: 0.02, roughLite: 0.0012 }; // 1カットあたりの目安
const LIMITS = { convertChars: 6000 };

async function apiPost(body) {
  const user = auth.currentUser;
  if (!user) throw new Error('AI機能を使うにはログインが必要です');
  const token = await user.getIdToken();
  let res;
  try {
    res = await fetch(API_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }, body: JSON.stringify(body) });
  } catch { throw new Error('AIサーバーに接続できませんでした。通信状況を確認してください'); }
  if (!res.ok) { let msg = `AIサーバーエラー（${res.status}）`; try { msg = (await res.json()).error || msg; } catch {} throw new Error(msg); }
  return res;
}
const apiJson = async body => (await apiPost(body)).json();

// ストリーミング呼び出し（サーバーからの NDJSON を1行ずつ読む）
async function callClaude({ task, input, onText }) {
  const res = await apiPost({ action: 'stream', task, input });
  const reader = res.body.getReader(); const dec = new TextDecoder();
  let buf = '', full = '', done = null;
  while (true) {
    const { done: end, value } = await reader.read();
    if (end) break;
    buf += dec.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 1);
      if (!line) continue;
      let ev; try { ev = JSON.parse(line); } catch { continue; }
      if (ev.type === 'text') { full += ev.text; onText && onText(full); }
      else if (ev.type === 'done') done = ev;
      else if (ev.type === 'error') throw new Error(ev.message);
    }
  }
  if (!done) throw new Error('AIの応答が途中で切れました。もう一度お試しください');
  console.log(`AI ${task}: ${full.length}字 / 本日 ${done.used}/${done.limit} 回 / 約$${done.costUsd}`);
  return { text: full, ...done };
}

// 呼び出しフック：ローディング（生成文字数）とエラー表示を管理
function useClaude() {
  const [loading, setLoading] = useState(false);
  const [chars, setChars] = useState(0);
  const [error, setError] = useState('');
  const run = useCallback(async (task, input) => {
    setLoading(true); setChars(0); setError('');
    try { return await callClaude({ task, input, onText: t => setChars(t.length) }); }
    catch (e) { console.error(`AI ${task} 失敗`, e.message); setError(e.message); return null; }
    finally { setLoading(false); }
  }, []);
  return { run, loading, chars, error, setError };
}

  const m = text.match(/<svg[\s\S]*<\/svg>/i);
  if (!m) throw new Error('ラフ画像を生成できませんでした');
  const { w, h } = canvasSize(ASPECTS[aspect]);
  return svgToJpeg(m[0], w, h);
}

function Modal({ title, onClose, children, wide, footer }) {
  useEffect(() => { const h = e => e.key === 'Escape' && onClose(); window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h); }, [onClose]);
  return (
    <div className="no-print fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-3" onMouseDown={e => e.target === e.currentTarget && onClose()}>
      <div className={`bg-white rounded-2xl shadow-xl w-full ${wide ? 'max-w-4xl' : 'max-w-xl'} max-h-[92vh] flex flex-col`}>
        <div className="flex items-center px-5 py-3 border-b">
          <h3 className="font-bold text-lg">{title}</h3>
          <button onClick={onClose} className="ml-auto text-slate-400 hover:text-slate-700 text-2xl leading-none">&times;</button>
        </div>
        <div className="p-5 overflow-y-auto text-sm leading-relaxed">{children}</div>
        {footer && <div className="px-5 py-3 border-t flex flex-wrap gap-2 justify-end">{footer}</div>}
      </div>
    </div>
  );
}

function MiniMd({ text }) {
  return <div>{text.split('\n').map((l, i) => {
    if (l.startsWith('### ')) return <h4 key={i} className="font-bold mt-3 mb-1">{l.slice(4)}</h4>;
    if (l.startsWith('## ')) return <h3 key={i} className="font-bold text-base mt-4 mb-1 border-b">{l.slice(3)}</h3>;
    if (l.startsWith('- ')) return <div key={i} className="pl-4 -indent-3">・{l.slice(2)}</div>;
    if (l.startsWith('    ')) return <pre key={i} className="bg-slate-100 px-2 text-xs">{l.slice(4)}</pre>;
    return l ? <p key={i} className="my-1">{l}</p> : <div key={i} className="h-1" />;
  })}</div>;
}

function AutoTextarea({ value, onChange, className = '', placeholder, minRows = 1 }) {
  const ref = useRef(null);
  useLayoutEffect(() => { const el = ref.current; if (!el) return; el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }, [value]);
  return <textarea ref={ref} rows={minRows} value={value} placeholder={placeholder} onChange={e => onChange(e.target.value)} className={`cell-input ${className}`} />;
}

const Btn = ({ children, onClick, kind = 'default', className = '', disabled, title }) => {
  const k = { default: 'bg-white border border-slate-300 hover:bg-slate-50 text-slate-700', primary: 'bg-blue-900 hover:bg-blue-800 text-white', ai: 'bg-violet-600 hover:bg-violet-500 text-white', danger: 'bg-white border border-rose-300 text-rose-600 hover:bg-rose-50' }[kind];
  return <button title={title} disabled={disabled} onClick={onClick} className={`px-3 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap disabled:opacity-40 ${k} ${className}`}>{children}</button>;
};

// ===== 絵（PICTURE）セル =====
function PictureBox({ cut, ratio, aspect, width, selected, onSelect, onSetImage, onSwap, onSketch, onAi, aiState }) {
  const fileRef = useRef(null);
  const [over, setOver] = useState(false);
  const [aw, ah] = aspect.split(':');
  const onDrop = async e => {
    e.preventDefault(); e.stopPropagation(); setOver(false);
    const from = e.dataTransfer.getData('application/x-cut-id');
    if (from) { if (from !== cut.id) onSwap(from, cut.id); return; }
    const f = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
    if (f) onSetImage(await fileToDataUrl(f));
  };
  return (
    <div style={{ width, aspectRatio: `${aw} / ${ah}` }}
      className={`relative group border-[3px] border-black bg-white cursor-pointer mx-auto ${selected ? 'ring-4 ring-amber-400' : ''} ${over ? 'ring-4 ring-blue-500' : ''}`}
      onClick={onSelect}
      onDragOver={e => { e.preventDefault(); e.stopPropagation(); setOver(true); }}
      onDragLeave={() => setOver(false)}
      onDrop={onDrop}
      onDoubleClick={() => onSketch()}>
      {cut.image
        ? <img src={cut.image} draggable onDragStart={e => { e.dataTransfer.setData('application/x-cut-id', cut.id); e.dataTransfer.effectAllowed = 'move'; }} className="w-full h-full object-contain select-none" alt="" />
        : <div className="w-full h-full flex flex-col items-center justify-center text-slate-400 text-xs gap-1 p-2 text-center">
            <span className="text-2xl">🖼️</span>
            <span>クリックで選択→貼り付け(⌘V)<br />画像をドロップ／ダブルクリックで描く</span>
          </div>}
      {aiState != null && <div className="absolute inset-0 bg-white/85 flex flex-col items-center justify-center text-violet-700 text-xs gap-2">
        <div className="w-6 h-6 border-[3px] border-violet-300 border-t-violet-700 rounded-full animate-spin" />
        生成中...（{aiState}字）
      </div>}
      <div className="absolute bottom-1 right-1 flex gap-1 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition no-print" onClick={e => e.stopPropagation()}>
        <button title="画像を差し替え" onClick={() => fileRef.current.click()} className="bg-white/95 border rounded px-1.5 py-0.5 text-xs shadow">📁</button>
        <button title="手描きで描く／描き足す" onClick={onSketch} className="bg-white/95 border rounded px-1.5 py-0.5 text-xs shadow">✏️</button>
        <button title="AIでラフを生成（Claude）" onClick={onAi} disabled={aiState != null} className="bg-white/95 border rounded px-1.5 py-0.5 text-xs shadow">🤖</button>
        {cut.image && <button title="絵を削除" onClick={() => onSetImage('')} className="bg-white/95 border rounded px-1.5 py-0.5 text-xs shadow">🗑</button>}
      </div>
      <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={async e => { const f = e.target.files[0]; if (f) onSetImage(await fileToDataUrl(f)); e.target.value = ''; }} />
    </div>
  );
}

// 行操作ボタン
function RowOps({ index, total, onMove, onDup, onDel, onInsert }) {
  const b = 'w-6 h-6 rounded hover:bg-slate-200 text-xs leading-none text-slate-600';
  return (
    <div className="flex flex-wrap gap-0.5 justify-center no-print">
      <button className={b} title="上へ" disabled={index === 0} onClick={() => onMove(-1)}>▲</button>
      <button className={b} title="下へ" disabled={index === total - 1} onClick={() => onMove(1)}>▼</button>
      <button className={b} title="下にカットを挿入" onClick={onInsert}>＋</button>
      <button className={b} title="複製" onClick={onDup}>⧉</button>
      <button className={`${b} hover:bg-rose-100 hover:text-rose-600`} title="削除" onClick={onDel}>✕</button>
    </div>
  );
}

// ===== 印刷用（PDF書き出し） =====
function printLayout(p) {
  const ratio = ASPECTS[p.aspect];
  const avail = 258; // A4縦・余白込みで表に使える高さ(mm)
  const maxW = 84;
  let per = +p.cutsPerPage;
  if (!per) { const h0 = Math.min(maxW / ratio, 80); per = Math.max(2, Math.min(6, Math.floor(avail / (h0 + 4)))); }
  const rowH = avail / per;
  let picH = Math.min(rowH - 4, maxW / ratio); let picW = picH * ratio;
  return { per, rowH, picW, picH };
}

// ===== 手描きスケッチ =====
function SketchModal({ cut, ratio, onSave, onClose }) {
  const { w, h } = canvasSize(ratio);
  const canvasRef = useRef(null);
  const undoRef = useRef([]);
  const drawing = useRef(null);
  const [tool, setTool] = useState('pen');
  const [size, setSize] = useState(4);
  const TOOLS = { pen: { label: '✏️ 線', color: '#111' }, shade: { label: '🟦 影(青)', color: '#b9dff2' }, red: { label: '🟥 指示(赤)', color: '#e11d48' }, eraser: { label: '🧽 消しゴム', color: '#ffffff' } };

  useEffect(() => {
    const x = canvasRef.current.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
    if (cut.image) {
      const img = new Image();
      img.onload = () => { const r = Math.min(w / img.width, h / img.height); const dw = img.width * r, dh = img.height * r; x.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh); };
      img.src = cut.image;
    }
  }, []);

  const pos = e => { const r = canvasRef.current.getBoundingClientRect(); return { x: (e.clientX - r.left) * w / r.width, y: (e.clientY - r.top) * h / r.height }; };
  const down = e => {
    e.preventDefault(); canvasRef.current.setPointerCapture(e.pointerId);
    const x = canvasRef.current.getContext('2d');
    undoRef.current.push(x.getImageData(0, 0, w, h)); if (undoRef.current.length > 15) undoRef.current.shift();
    drawing.current = pos(e);
  };
  const move = e => {
    if (!drawing.current) return;
    const x = canvasRef.current.getContext('2d'); const p = pos(e);
    const base = tool === 'shade' ? size * 6 : tool === 'eraser' ? size * 5 : size;
    x.globalCompositeOperation = tool === 'shade' ? 'darken' : 'source-over';
    x.strokeStyle = TOOLS[tool].color; x.lineCap = 'round'; x.lineJoin = 'round';
    x.lineWidth = e.pointerType === 'pen' && e.pressure > 0 && tool === 'pen' ? base * (0.4 + e.pressure * 1.2) : base;
    x.beginPath(); x.moveTo(drawing.current.x, drawing.current.y); x.lineTo(p.x, p.y); x.stroke();
    x.globalCompositeOperation = 'source-over';
    drawing.current = p;
  };
  const up = () => { drawing.current = null; };
  const undo = () => { const d = undoRef.current.pop(); if (d) canvasRef.current.getContext('2d').putImageData(d, 0, 0); };
  const clear = () => { const x = canvasRef.current.getContext('2d'); undoRef.current.push(x.getImageData(0, 0, w, h)); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); };

  return (
    <Modal title="✏️ 手描きスケッチ" onClose={onClose} wide footer={<>
      <Btn onClick={onClose}>キャンセル</Btn>
      <Btn kind="primary" onClick={() => onSave(canvasRef.current.toDataURL('image/jpeg', 0.88))}>この絵で確定</Btn>
    </>}>
      <div className="flex flex-wrap gap-2 items-center mb-3">
        {Object.entries(TOOLS).map(([k, t]) => <Btn key={k} onClick={() => setTool(k)} className={tool === k ? '!bg-blue-900 !text-white' : ''}>{t.label}</Btn>)}
        <label className="flex items-center gap-1 text-xs ml-2">太さ<input type="range" min="1" max="16" value={size} onChange={e => setSize(+e.target.value)} /></label>
        <Btn onClick={undo}>↶ 戻す</Btn>
        <Btn kind="danger" onClick={clear}>全消去</Btn>
      </div>
      <canvas ref={canvasRef} width={w} height={h} onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up}
        className="border-2 border-black bg-white mx-auto block" style={{ touchAction: 'none', maxWidth: '100%', maxHeight: '62vh', aspectRatio: `${w} / ${h}` }} />
      <p className="text-xs text-slate-500 mt-2">既存の絵の上に描き足せます。影(青)は線を潰さず重ね塗りできます。Apple Pencil 等の筆圧に対応。</p>
    </Modal>
  );
}

// ===== テキスト読込／AI変換 =====
function ImportModal({ initialText, onApply, onClose }) {
  const [text, setText] = useState(initialText || '');
  const [mode, setMode] = useState('new');
  const [err, setErr] = useState('');
  const claude = useClaude();
  const busy = claude.loading ? claude.chars : null;
  const fileRef = useRef(null);

  const rule = () => {
    const r = parseMarkdown(text);
    if (!r.cuts.length) { setErr('カットが見つかりませんでした。書式ヘルプを確認するか「AIで変換」を試してください。'); return; }
    onApply(r, mode);
  };
  const ai = async () => {
    setErr('');
    const r = await claude.run('convert', { text });
    if (!r) return;
    try {
      if (r.stopReason === 'max_tokens') console.warn('AI変換: 出力上限に到達（途中までの可能性）');
      const out = r.text;
      const json = JSON.parse(out.slice(out.indexOf('{'), out.lastIndexOf('}') + 1));
      const cuts = (json.cuts || []).map(c => newCut({ scene: c.scene || '', action: c.action || '', camera: c.camera || '', dialogue: c.dialogue || '', sound: c.sound || '', note: c.note || '', duration: +c.duration || 3 }));
      if (!cuts.length) throw new Error('カットが生成されませんでした');
      onApply({ title: json.title || '', cuts }, mode);
    } catch (e) { console.error('AI変換の解析失敗', e.message); setErr('AIの出力を読み取れませんでした。もう一度お試しください'); }
  };
  const over = text.length > LIMITS.convertChars;

  return (
    <Modal title="📥 脚本・シーン割りを読み込む" onClose={onClose} wide footer={<>
      <select value={mode} onChange={e => setMode(e.target.value)} className="border rounded-lg px-2 text-sm mr-auto">
        <option value="new">新しいプロジェクトとして作成</option>
        <option value="replace">今のプロジェクトを置き換え</option>
        <option value="append">今のプロジェクトの末尾に追加</option>
      </select>
      <Btn onClick={rule} disabled={!text.trim() || busy != null}>📄 ルールで変換（無料）</Btn>
      <Btn kind="ai" onClick={ai} disabled={!text.trim() || busy != null || over}>{busy != null ? `生成中...（${busy}字）` : '🤖 AIで変換'}</Btn>
    </>}>
      <div className="flex gap-2 mb-2">
        <Btn onClick={() => fileRef.current.click()}>ファイルを開く（.md / .txt）</Btn>
        <Btn onClick={() => setText(SAMPLE_MD)}>サンプルを入れる</Btn>
        <input ref={fileRef} type="file" accept=".md,.markdown,.txt,text/*" className="hidden" onChange={async e => { const f = e.target.files[0]; if (f) setText(await f.text()); e.target.value = ''; }} />
      </div>
      <textarea value={text} onChange={e => setText(e.target.value)} className="w-full h-[45vh] border rounded-lg p-3 font-mono text-xs" placeholder="ここに Markdown の脚本・シーン割りを貼り付け" />
      {busy != null && <div className="flex items-center gap-2 text-violet-700 text-xs mt-2"><div className="w-4 h-4 border-2 border-violet-300 border-t-violet-700 rounded-full animate-spin" />生成中...（{busy}字）</div>}
      <div className={`text-right text-xs mt-1 ${over ? 'text-rose-600 font-bold' : 'text-slate-400'}`}>{text.length.toLocaleString()} / {LIMITS.convertChars.toLocaleString()}字（AI変換の上限）</div>
      {(err || claude.error) && <p className="text-rose-600 text-xs mt-2">{err || claude.error}</p>}
      <p className="text-xs text-slate-500 mt-2">ルール変換は「### CUT」見出し・表・箇条書きを解析します（書式はアプリ名をクリック→ヘルプ）。自由形式の脚本は AI変換がおすすめ（1回 約5円・1日20回まで）。上限を超える場合はシーンごとに分けて「末尾に追加」で読み込んでください。</p>
    </Modal>
  );
}

// ===== プレビュー再生（簡易ビデオコンテ） =====
function PlayerModal({ p, starts, total, tts, onClose }) {
  const [idx, setIdx] = useState(0);
  const [t, setT] = useState(0);
  const [playing, setPlaying] = useState(true);
  const [speak, setSpeak] = useState(tts);
  const last = useRef(null);
  const c = p.cuts[idx] || {};
  const dur = Math.max(0.5, +c.duration || 0);

  useEffect(() => {
    if (!playing) { last.current = null; return; }
    let raf;
    const tick = now => {
      if (last.current != null) {
        setT(prev => {
          const n = prev + (now - last.current) / 1000;
          if (n >= dur) { if (idx < p.cuts.length - 1) { setIdx(idx + 1); return 0; } setPlaying(false); return dur; }
          return n;
        });
      }
      last.current = now; raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [playing, idx, dur]);

  // セリフ読み上げ（仮の音）
  useEffect(() => {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    if (!speak || !playing || !c.dialogue) return;
    const body = c.dialogue.split('\n').map(l => (l.match(/[「『](.*?)[」』]?$/) || [null, l])[1]).join('。');
    const u = new SpeechSynthesisUtterance(body); u.lang = 'ja-JP'; u.rate = 1.1; speechSynthesis.speak(u);
  }, [idx, speak, playing]);
  useEffect(() => () => { if ('speechSynthesis' in window) speechSynthesis.cancel(); }, []);

  useEffect(() => {
    const h = e => {
      if (e.key === ' ') { e.preventDefault(); setPlaying(v => !v); }
      if (e.key === 'ArrowRight') { setIdx(i => Math.min(p.cuts.length - 1, i + 1)); setT(0); }
      if (e.key === 'ArrowLeft') { setIdx(i => Math.max(0, i - 1)); setT(0); }
    };
    window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
  }, []);

  const [aw, ah] = p.aspect.split(':');
  const go = i => { setIdx(i); setT(0); };
  return (
    <div className="no-print fixed inset-0 z-50 bg-black/90 flex flex-col items-center justify-center p-4 text-white">
      <button onClick={onClose} className="absolute top-3 right-4 text-3xl text-white/70 hover:text-white">&times;</button>
      <div className="relative bg-white" style={{ aspectRatio: `${aw} / ${ah}`, width: `min(92vw, calc(70vh * ${ASPECTS[p.aspect]}))` }}>
        {c.image ? <img src={c.image} className="w-full h-full object-contain" /> : <div className="w-full h-full flex items-center justify-center text-slate-500 p-6 text-center whitespace-pre-wrap">{c.action || '（絵なし）'}</div>}
        {c.dialogue && <div className="absolute bottom-3 left-0 right-0 text-center px-4"><span className="bg-black/70 px-3 py-1 rounded text-lg whitespace-pre-wrap leading-relaxed">{c.dialogue}</span></div>}
        <div className="absolute top-2 left-2 bg-black/60 rounded px-2 text-xs font-mono">CUT {cutNo(idx)} {c.camera && `｜📷 ${c.camera}`}</div>
      </div>
      <div className="mt-3 text-sm text-white/80 max-w-3xl text-center whitespace-pre-wrap">{c.action}{c.sound && `　♪ ${c.sound}`}</div>
      <div className="w-full max-w-3xl mt-3 flex h-2 rounded overflow-hidden bg-white/10 cursor-pointer">
        {p.cuts.map((x, i) => <div key={x.id} onClick={() => go(i)} title={`CUT ${cutNo(i)}`} style={{ flex: Math.max(0.5, +x.duration || 0) }} className={`border-r border-black ${i < idx ? 'bg-sky-400' : i === idx ? 'bg-sky-700' : 'bg-white/20'}`}>
          {i === idx && <div className="h-full bg-sky-300" style={{ width: `${Math.min(100, t / dur * 100)}%` }} />}
        </div>)}
      </div>
      <div className="mt-3 flex gap-3 items-center text-sm">
        <button onClick={() => go(Math.max(0, idx - 1))} className="px-3 py-1 bg-white/10 rounded">⏮</button>
        <button onClick={() => { if (!playing && idx === p.cuts.length - 1 && t >= dur) go(0); setPlaying(v => !v); }} className="px-4 py-1 bg-white/20 rounded">{playing ? '⏸ 一時停止' : '▶ 再生'}</button>
        <button onClick={() => go(Math.min(p.cuts.length - 1, idx + 1))} className="px-3 py-1 bg-white/10 rounded">⏭</button>
        <span className="font-mono">{fmtTC(starts[idx] + t)} / {fmtTC(total)}</span>
        <label className="flex items-center gap-1"><input type="checkbox" checked={speak} onChange={e => setSpeak(e.target.checked)} />セリフ読み上げ</label>
      </div>
    </div>
  );
}

// ===== メインアプリ =====
function App({ user }) {
  const [projects, setProjects] = useState([]);       // 一覧用メタ情報
  const [project, setProject] = useState(null);       // 編集中プロジェクト
  const [view, setView] = useState('e');              // e=絵コンテ / ji=字コンテ
  const [settings, setSettings] = useState(loadSettings);
  const [modal, setModal] = useState(null);           // help / notes / settings / import / sketch / player
  const [importText, setImportText] = useState('');
  const [sketchId, setSketchId] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const [aiBusy, setAiBusy] = useState({});
  const [printMode, setPrintMode] = useState(null);
  const [toast, setToast] = useState('');
  const [exportOpen, setExportOpen] = useState(false);
  const hist = useRef({ past: [], future: [], key: null, t: 0 });
  const projectRef = useRef(null); projectRef.current = project;

  const notify = msg => { setToast(msg); clearTimeout(notify.t); notify.t = setTimeout(() => setToast(''), 2600); };

  // 初期読込
  useEffect(() => {
    (async () => {
      let all = [];
      try { all = await idb.all(); } catch (e) { console.error('IndexedDB読込失敗', e.message); }
      if (!all.length) {
        const r = parseMarkdown(SAMPLE_MD);
        const sample = newProject(r.title, r.cuts);
        await idb.put(sample).catch(() => {});
        all = [sample];
      }
      all.sort((a, b) => b.updatedAt - a.updatedAt);
      setProjects(all.map(({ id, title, updatedAt }) => ({ id, title, updatedAt })));
      const lastId = localStorage.getItem('sbm_last');
      setProject(all.find(p => p.id === lastId) || all[0]);
      console.log('プロジェクト読込', all.length, '件');
    })();
  }, []);

  // 自動保存（500ms デバウンス）
  useEffect(() => {
    if (!project) return;
    localStorage.setItem('sbm_last', project.id);
    const tm = setTimeout(() => {
      const p = { ...project, updatedAt: Date.now() };
      idb.put(p).catch(e => { console.error('保存失敗', e.message); notify('⚠️ 保存に失敗しました（容量不足の可能性）'); });
      setProjects(list => { const m = { id: p.id, title: p.title, updatedAt: p.updatedAt }; const rest = list.filter(x => x.id !== p.id); return [m, ...rest]; });
    }, 500);
    return () => clearTimeout(tm);
  }, [project]);

  // 変更を履歴付きで反映（同じ欄の連続入力は1つにまとめる）
  const commit = useCallback((updater, key) => {
    setProject(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      if (next === prev) return prev;
      const h = hist.current; const now = Date.now();
      if (!(key && h.key === key && now - h.t < 1500)) { h.past.push(prev); if (h.past.length > 100) h.past.shift(); }
      h.future = []; h.key = key; h.t = now;
      return next;
    });
  }, []);
  const undo = () => setProject(cur => { const h = hist.current; if (!h.past.length) return cur; h.future.push(cur); h.key = null; return h.past.pop(); });
  const redo = () => setProject(cur => { const h = hist.current; if (!h.future.length) return cur; h.past.push(cur); h.key = null; return h.future.pop(); });
  const resetHist = () => { hist.current = { past: [], future: [], key: null, t: 0 }; };

  const setCuts = (fn, key) => commit(p => ({ ...p, cuts: fn(p.cuts) }), key);

  // カット操作
  const ops = {
    update: (id, patch, key) => setCuts(cs => cs.map(c => c.id === id ? { ...c, ...patch } : c), key && `${id}:${key}`),
    move: (id, d) => setCuts(cs => { const i = cs.findIndex(c => c.id === id); const j = i + d; if (j < 0 || j >= cs.length) return cs; const a = [...cs];[a[i], a[j]] = [a[j], a[i]]; return a; }),
    moveTo: (fromId, toId) => setCuts(cs => { if (fromId === toId) return cs; const a = [...cs]; const i = a.findIndex(c => c.id === fromId); const [x] = a.splice(i, 1); const j = a.findIndex(c => c.id === toId); a.splice(j, 0, x); return a; }),
    dup: id => setCuts(cs => { const i = cs.findIndex(c => c.id === id); const a = [...cs]; a.splice(i + 1, 0, { ...cs[i], id: uid() }); return a; }),
    del: id => { setCuts(cs => cs.length <= 1 ? [newCut()] : cs.filter(c => c.id !== id)); notify('カットを削除しました（⌘Z で元に戻せます）'); },
    insert: afterId => setCuts(cs => { const i = afterId ? cs.findIndex(c => c.id === afterId) : cs.length - 1; const a = [...cs]; a.splice(i + 1, 0, newCut({ scene: (cs[i] || {}).scene || '' })); return a; }),
    swap: (a, b) => { setCuts(cs => { const A = cs.find(c => c.id === a), B = cs.find(c => c.id === b); return cs.map(c => c.id === a ? { ...c, image: B.image } : c.id === b ? { ...c, image: A.image } : c); }); notify('絵を入れ替えました'); },
    sketch: id => { setSketchId(id); setModal('sketch'); },
    aiRough: id => genRough(id),
  };

  // AIラフ生成（1カット・ストリーミング）
  const genRough = async (id) => {
    const p = projectRef.current; const i = p.cuts.findIndex(c => c.id === id);
    setAiBusy(b => ({ ...b, [id]: 0 }));
    try {
      const r = await callClaude({ task: settings.roughTask, input: roughInput(p, i), onText: t => setAiBusy(b => ({ ...b, [id]: t.length })) });
      const img = await svgFromText(r.text, p.aspect);
      commit(pp => ({ ...pp, cuts: pp.cuts.map(x => x.id === id ? { ...x, image: img } : x) }));
      return true;
    } catch (e) { console.error('AIラフ失敗', e.message); notify('AIラフ失敗: ' + e.message.slice(0, 80)); return false; }
    finally { setAiBusy(b => { const n = { ...b }; delete n[id]; return n; }); }
  };

  const roughTargets = () => project.cuts.filter(c => !c.image);
  const genRoughAll = () => {
    if (project.pendingBatch) { notify('バッチ生成の完了待ちです'); return; }
    if (!roughTargets().length) { notify('絵のないカットはありません'); return; }
    setModal('roughAll');
  };
  // 今すぐ生成（1カットずつ順番に）
  const runRoughNow = async () => {
    setModal(null);
    const ids = roughTargets().map(c => c.id); let ok = 0;
    for (const id of ids) { if (await genRough(id)) ok++; else break; } // 上限・エラー時は止める
    notify(`AIラフ生成：${ok}/${ids.length} カット完了`);
  };
  // バッチ生成（Batch API・半額。完了は30秒ごとに確認）
  const runRoughBatch = async () => {
    setModal(null);
    const p = projectRef.current;
    const items = p.cuts.map((c, i) => ({ c, i })).filter(x => !x.c.image).slice(0, 50).map(({ c, i }) => ({ id: c.id, input: roughInput(p, i) }));
    try {
      const r = await apiJson({ action: 'batchCreate', task: settings.roughTask, items });
      commit(pp => ({ ...pp, pendingBatch: { id: r.batchId, count: r.count, createdAt: Date.now() } }));
      notify(`バッチ生成を開始しました（${r.count}カット）。完了すると自動で反映されます`);
    } catch (e) { console.error('バッチ作成失敗', e.message); notify(e.message); }
  };

  // バッチの完了確認（ページを開いている間 30 秒ごと。閉じても次回開いた時に反映）
  const pendingBatchId = project && project.pendingBatch && project.pendingBatch.id;
  useEffect(() => {
    if (!pendingBatchId || !user) return;
    let stopped = false;
    const check = async () => {
      try {
        const r = await apiJson({ action: 'batchStatus', batchId: pendingBatchId });
        if (stopped || r.status !== 'ended') return;
        const aspect = projectRef.current.aspect; const imgs = {}; let ng = 0;
        for (const x of r.results) {
          if (!x.text) { ng++; continue; }
          try { imgs[x.id] = await svgFromText(x.text, aspect); } catch { ng++; }
        }
        commit(pp => ({ ...pp, pendingBatch: null, cuts: pp.cuts.map(c => imgs[c.id] && !c.image ? { ...c, image: imgs[c.id] } : c) }));
        notify(`バッチ生成完了：${Object.keys(imgs).length}カットに絵を追加${ng ? `（失敗 ${ng}）` : ''}`);
      } catch (e) {
        console.error('バッチ確認失敗', e.message);
        if (/見つかりません|不正/.test(e.message)) commit(pp => ({ ...pp, pendingBatch: null }));
      }
    };
    check(); const t = setInterval(check, 30000);
    return () => { stopped = true; clearInterval(t); };
  }, [pendingBatchId, user]);

  // プロジェクト操作
  const switchProject = async id => {
    if (id === project.id) return;
    const all = await idb.all(); const p = all.find(x => x.id === id);
    if (p) { resetHist(); setSelectedId(null); setProject(p); }
  };
  const createProject = (p) => { resetHist(); setSelectedId(null); setProject(p); setProjects(l => [{ id: p.id, title: p.title, updatedAt: Date.now() }, ...l]); };
  const deleteProject = async () => {
    if (!confirm(`「${project.title}」を削除します。元に戻せません。よろしいですか？`)) return;
    await idb.del(project.id);
    const rest = projects.filter(x => x.id !== project.id);
    setProjects(rest);
    if (rest.length) { const all = await idb.all(); resetHist(); setProject(all.find(x => x.id === rest[0].id)); }
    else createProject(newProject());
  };

  const applyImport = ({ title, cuts }, mode) => {
    if (mode === 'new') createProject({ ...newProject(title || '読み込んだコンテ', cuts), aspect: project.aspect });
    else if (mode === 'replace') commit(p => ({ ...p, title: title || p.title, cuts }));
    else commit(p => ({ ...p, cuts: [...p.cuts, ...cuts] }));
    setModal(null); notify(`${cuts.length} カットを読み込みました`);
  };

  const importJson = text => {
    const j = JSON.parse(text);
    if (!Array.isArray(j.cuts)) throw new Error('cuts がありません');
    const p = { ...newProject(j.title || '読み込んだコンテ'), aspect: ASPECTS[j.aspect] ? j.aspect : '16:9', cutsPerPage: +j.cutsPerPage || 0, cuts: j.cuts.map(c => newCut({ ...c, id: uid() })) };
    createProject(p); notify(`JSONを読み込みました（${p.cuts.length} カット）`);
  };

  const openFile = async file => {
    try {
      const text = await file.text();
      if (/\.json$/i.test(file.name) || text.trim().startsWith('{')) importJson(text);
      else { setImportText(text); setModal('import'); }
    } catch (e) { console.error('ファイル読込失敗', e.message); notify('読み込み失敗: ' + e.message); }
  };

  // 書き出し
  const exportPdf = mode => {
    setExportOpen(false); setPrintMode(mode);
    const old = document.title; document.title = `${safeName(project.title)}_${mode === 'e' ? '絵コンテ' : '字コンテ'}`;
    setTimeout(() => { window.print(); document.title = old; setPrintMode(null); }, 400);
  };
  const exportMd = () => { setExportOpen(false); download(`${safeName(project.title)}.md`, toMarkdown(project), 'text/markdown'); };
  const exportJson = (withImages = true) => {
    setExportOpen(false);
    const { id, ...rest } = project;
    const data = { app: 'storyboard-maker', version: VERSION, ...rest, cuts: project.cuts.map(c => withImages ? c : { ...c, image: '' }) };
    download(`${safeName(project.title)}${withImages ? '' : '_textonly'}.json`, JSON.stringify(data, null, 2), 'application/json');
  };

  // キーボード・貼り付け・ファイルドロップ
  useEffect(() => {
    const editable = el => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
    const onKey = e => {
      const mod = e.metaKey || e.ctrlKey;
      if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); notify('💾 自動保存されています'); return; }
      if (modal || editable(document.activeElement)) return;
      if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
      if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
    };
    const onPaste = async e => {
      const item = [...(e.clipboardData && e.clipboardData.items || [])].find(i => i.type.startsWith('image/'));
      if (!item) return;
      const target = selectedId && projectRef.current.cuts.find(c => c.id === selectedId);
      if (!target) { notify('先に絵を貼りたいカットの PICTURE をクリックしてください'); return; }
      e.preventDefault();
      const img = await fileToDataUrl(item.getAsFile());
      ops.update(target.id, { image: img });
      notify(`CUT ${cutNo(projectRef.current.cuts.findIndex(c => c.id === target.id))} に貼り付けました`);
    };
    const onDragOver = e => { if ([...e.dataTransfer.types].includes('Files')) e.preventDefault(); };
    const onDrop = e => {
      const f = [...e.dataTransfer.files].find(f => /\.(md|markdown|txt|json)$/i.test(f.name));
      if (f) { e.preventDefault(); openFile(f); }
      else if (e.dataTransfer.files.length) e.preventDefault();
    };
    window.addEventListener('keydown', onKey); window.addEventListener('paste', onPaste);
    window.addEventListener('dragover', onDragOver); window.addEventListener('drop', onDrop);
    return () => { window.removeEventListener('keydown', onKey); window.removeEventListener('paste', onPaste); window.removeEventListener('dragover', onDragOver); window.removeEventListener('drop', onDrop); };
  }, [modal, selectedId, project && project.id]);

  const { starts, total } = useMemo(() => {
    if (!project) return { starts: [], total: 0 };
    const s = []; let acc = 0; project.cuts.forEach(c => { s.push(acc); acc += +c.duration || 0; });
    return { starts: s, total: acc };
  }, [project]);

  const copyLogs = async () => {
    const text = [`${APP_NAME} v${VERSION}`, navigator.userAgent, `project: ${project && project.title} (${project && project.cuts.length} cuts)`, '', ...window._logs].join('\n');
    try { await navigator.clipboard.writeText(text); notify('🐞 ログをコピーしました'); } catch { download('debug-log.txt', text); }
  };

  if (!project) return <div className="min-h-screen flex items-center justify-center text-slate-500">読み込み中...</div>;
  const sketchCut = project.cuts.find(c => c.id === sketchId);
  const fileInputId = 'sbm-file';

  return (
    <>

            <label htmlFor={fileInputId} className="px-3 py-1.5 rounded-lg text-sm font-medium bg-white border border-slate-300 hover:bg-slate-50 cursor-pointer">📂 ファイル</label>

            <div className="relative">
              <Btn kind="primary" onClick={() => setExportOpen(v => !v)}>📤 書き出し ▾</Btn>
              {exportOpen && <div className="absolute right-0 md:left-0 md:right-auto mt-1 bg-white border rounded-xl shadow-lg py-1 w-56 z-40" onMouseLeave={() => setExportOpen(false)}>
                {[['🖨 PDF（絵コンテ）', () => exportPdf('e')], ['🖨 PDF（字コンテ）', () => exportPdf('ji')], ['📄 Markdown（.md）', exportMd], ['🧩 JSON（絵を含む）', () => exportJson(true)], ['🧩 JSON（テキストのみ）', () => exportJson(false)]].map(([l, f]) =>
                  <button key={l} onClick={f} className="block w-full text-left px-4 py-2 text-sm hover:bg-slate-100">{l}</button>)}
              </div>}
            </div>
            <div className="flex items-center gap-1 ml-auto">
              <Btn onClick={undo} disabled={!hist.current.past.length} title="元に戻す (⌘Z)">↶</Btn>
              <Btn onClick={redo} disabled={!hist.current.future.length} title="やり直す (⌘⇧Z)">↷</Btn>
              <select value={project.aspect} onChange={e => commit(p => ({ ...p, aspect: e.target.value }))} className="border rounded-lg px-2 py-1.5 text-sm" title="画面比率">
                {Object.keys(ASPECTS).map(a => <option key={a}>{a}</option>)}
              </select>
              <select value={project.cutsPerPage} onChange={e => commit(p => ({ ...p, cutsPerPage: +e.target.value }))} className="border rounded-lg px-2 py-1.5 text-sm" title="PDFの1ページあたりカット数">

          <div className="flex flex-wrap gap-4 text-sm text-slate-600 mb-3">
            <span>カット数 <b className="text-slate-900">{project.cuts.length}</b></span>
            <span>総尺 <b className="text-slate-900 font-mono">{fmtTC(total)}</b>（{total}秒）</span>
            <span>絵あり <b className="text-slate-900">{project.cuts.filter(c => c.image).length}</b></span>
            {project.pendingBatch && <span className="text-violet-700 font-bold flex items-center gap-1"><span className="w-3 h-3 border-2 border-violet-300 border-t-violet-700 rounded-full animate-spin inline-block" />AIラフ バッチ生成中（{project.pendingBatch.count}カット）</span>}
            <span className="text-xs text-slate-400 self-center hidden md:inline">ヒント：絵をドラッグして別カットへ落とすと入れ替え／PICTUREを選択して ⌘V で貼り付け</span>

      {/* 印刷専用DOM */}
      {printMode && <div className="print-only">{printMode === 'e' ? <PrintEConte p={project} starts={starts} total={total} /> : <PrintJiConte p={project} starts={starts} total={total} />}</div>}

      {/* モーダル群 */}
      {modal === 'notes' && <Modal title="リリースノート" onClose={() => setModal(null)}><MiniMd text={RELEASE_NOTES} /></Modal>}
      {modal === 'help' && <Modal title={`${APP_NAME} の使い方`} onClose={() => setModal(null)} wide><MiniMd text={HELP_MD} /></Modal>}
      {modal === 'settings' && <SettingsModal settings={settings} onSave={s => { setSettings(s); saveSettings(s); setModal(null); notify('設定を保存しました'); }} onClose={() => setModal(null)} />}
      {modal === 'import' && <ImportModal initialText={importText} onApply={applyImport} onClose={() => setModal(null)} />}
      {modal === 'sketch' && sketchCut && <SketchModal cut={sketchCut} ratio={ASPECTS[project.aspect]} onClose={() => setModal(null)} onSave={img => { ops.update(sketchCut.id, { image: img }); setModal(null); }} />}
      {modal === 'roughAll' && <RoughAllModal count={roughTargets().length} task={settings.roughTask} onNow={runRoughNow} onBatch={runRoughBatch} onClose={() => setModal(null)} />}
      {modal === 'player' && <PlayerModal p={project} starts={starts} total={total} tts={settings.tts} onClose={() => setModal(null)} />}
    </>
  );
}

const yen = usd => `約${Math.max(0.1, usd * JPY_PER_USD).toFixed(usd * JPY_PER_USD < 10 ? 1 : 0)}円`;

function RoughAllModal({ count, task, onNow, onBatch, onClose }) {
  const per = ROUGH_COST_USD[task]; const n = Math.min(count, 50);
  return (
    <Modal title="🤖 AIラフ一括生成" onClose={onClose}>
      <p className="mb-4">絵のない <b>{count}</b> カットにラフを生成します（画質：{task === 'roughLite' ? '軽量' : '標準'}）。</p>
      <div className="grid gap-3">
        <button onClick={onNow} className="text-left border rounded-xl p-4 hover:bg-slate-50">
          <div className="font-bold">⚡ 今すぐ生成</div>
          <div className="text-xs text-slate-500 mt-1">1カットずつ順番に生成。目安 {yen(per * count)}（1カット{yen(per)}）</div>
        </button>
        <button onClick={onBatch} className="text-left border-2 border-violet-400 rounded-xl p-4 hover:bg-violet-50">
          <div className="font-bold text-violet-800">💰 バッチ生成（半額）👈</div>
          <div className="text-xs text-slate-500 mt-1">数分〜最大24時間で完了し、自動で反映。目安 {yen(per * n / 2)}{count > 50 && '（1回50カットまで）'}</div>
        </button>
      </div>
    </Modal>
  );
}

function SettingsModal({ settings, onSave, onClose }) {
  const [s, setS] = useState(settings);
  const [usage, setUsage] = useState(null);
  useEffect(() => { apiJson({ action: 'usage' }).then(setUsage).catch(e => setUsage({ error: e.message })); }, []);
  const LABEL = { convert: 'AI変換', rough: 'AIラフ（標準）', roughLite: 'AIラフ（軽量）' };
  return (
    <Modal title="⚙ 設定" onClose={onClose} footer={<><Btn onClick={onClose}>キャンセル</Btn><Btn kind="primary" onClick={() => onSave(s)}>保存</Btn></>}>
      <label className="block font-bold mb-2">AIラフの画質</label>
      {[['rough', '標準（きれい・1カット ' + yen(ROUGH_COST_USD.rough) + '）'], ['roughLite', '軽量（簡素・1カット ' + yen(ROUGH_COST_USD.roughLite) + '）']].map(([k, l]) =>
        <label key={k} className="flex items-center gap-2 mb-1"><input type="radio" checked={s.roughTask === k} onChange={() => setS({ ...s, roughTask: k })} />{l}</label>)}
      <label className="flex items-center gap-2 mt-4"><input type="checkbox" checked={s.tts} onChange={e => setS({ ...s, tts: e.target.checked })} />プレビュー再生でセリフを読み上げる</label>
      <div className="mt-5 border-t pt-4">
        <div className="font-bold mb-2">本日のAI利用状況</div>
        {!usage && <div className="text-xs text-slate-400">読み込み中...</div>}
        {usage && usage.error && <div className="text-xs text-rose-600">{usage.error}</div>}
        {usage && usage.limits && <>
          {Object.keys(usage.limits).map(k => <div key={k} className="flex justify-between text-sm"><span>{LABEL[k] || k}</span><span className="font-mono">{usage.counts[k] || 0} / {usage.limits[k]} 回</span></div>)}
          <div className="flex justify-between text-sm mt-1 text-slate-500"><span>本日の概算コスト</span><span className="font-mono">{yen(usage.costUsd)}（${(+usage.costUsd).toFixed(3)}）</span></div>
        </>}
      </div>
    </Modal>
  );
}

const HELP_MD = `## できること
- 脚本・シーン割りの Markdown を読み込んで、絵コンテ／字コンテを自動作成
- 表の中で直接クリックして文字を書き換え（自動保存）
- 絵の差し替え：📁アップロード／画像をドラッグ&ドロップ／PICTUREをクリックして ⌘V（スクショ貼り付け）
- 絵の入れ替え：絵を別カットの PICTURE へドラッグ
- ✏️ 手描き（ダブルクリックでも可）：既存の絵に描き足し、青い影塗り、赤い指示線
- 🤖 AIラフ：Claude が内容・カメラから構図ラフを作成（標準 約3円／軽量 約0.2円 per カット）
- 🤖 AIラフ一括：「バッチ生成」を選ぶと半額（完了まで数分〜最大24時間、自動で反映）
- AIの利用回数には1日の上限があります（⚙設定で確認）
- ⠿ をドラッグ、または ▲▼ でカットの並べ替え。＋挿入 ⧉複製 ✕削除
- ▶ プレビュー：秒数どおりに紙芝居再生（セリフ読み上げ付きの簡易ビデオコンテ）
- 📤 書き出し：PDF（絵コンテ／字コンテ）・Markdown・JSON
## md の書き方（ルール変換）
- # 見出し1 ＝ タイトル
- ## 見出し2 ＝ シーン（### がある場合）
- ### 見出し3 ＝ 1カット。「(3秒)」で尺を指定
- 「画: / カメラ: / セリフ: / 音: / 秒: / メモ:」の行で各欄に入る
- キーなしの行は内容へ、「名前「〜」」形式はセリフへ自動振り分け
- 表形式（| No | 内容 | セリフ | 秒 |）や、シーン見出し下の箇条書き（1行＝1カット）にも対応
- 自由形式の脚本は「🤖 AIで変換」が確実
## 例
    # タイトル
    ## シーン: 教室・放課後
    ### CUT 001 (4秒)
    - 画: 引きの絵で教室内
    - カメラ: PAN↑
    - セリフ: サエコ「こらハヤト」
    - 音: 放課後のざわめき
## ショートカット
- ⌘Z 元に戻す／⌘⇧Z やり直す（入力欄の外で）
- ⌘V 選択中カットに画像貼り付け
- プレビュー：Space 再生/停止、←→ 前後カット
## データについて
- データはこのブラウザ（IndexedDB）にのみ保存されます。別端末へ移すときは JSON（絵を含む）で書き出し→📂ファイルで読み込み
- md 書き出しは文字のみ。絵も残すなら JSON を使ってください
- PDF は印刷ダイアログで「PDFに保存」を選択（背景グラフィックON推奨）`;

// ===== ルート：認証ゲート =====
function Root() {
  const [state, setState] = useState(DEV_BYPASS ? { ok: true, user: null } : { ok: false, loading: true });
  useEffect(() => {
    if (DEV_BYPASS) return;
    return auth.onAuthStateChanged(u => {
      if (!u) return setState({ ok: false });
      if (!ALLOWED_EMAILS.includes(u.email)) { auth.signOut(); return setState({ ok: false, msg: `${u.email} には閲覧権限がありません` }); }
      setState({ ok: true, user: u });
    });
  }, []);
  if (state.loading) return <div className="min-h-screen flex items-center justify-center text-slate-500">認証確認中...</div>;
  if (!state.ok) return <Gate msg={state.msg} />;
  return <App user={state.user} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>

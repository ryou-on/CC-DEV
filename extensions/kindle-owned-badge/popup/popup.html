<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  body {
    width: 280px;
    margin: 0;
    padding: 14px;
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    font-size: 13px;
    color: #111;
    background: #fff;
  }
  h1 {
    margin: 0 0 10px;
    font-size: 15px;
  }
  .stats {
    background: #f4f6f8;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
    line-height: 1.8;
  }
  .stats .num { font-weight: 700; }
  .badge-sample {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    color: #fff;
    font-weight: 700;
    font-size: 12px;
    margin-right: 4px;
  }
  .purchase { background: #cc0c39; }
  .rental { background: #007185; }
  .captured { background: #6d28d9; }
  button {
    width: 100%;
    padding: 9px 0;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  #syncBtn {
    background: #ffd814;
    font-weight: 700;
    margin-bottom: 8px;
  }
  #syncBtn:hover { background: #f7ca00; }
  #debugBtn {
    background: #e8eaed;
    color: #333;
  }
  #status {
    margin-top: 8px;
    font-size: 12px;
    color: #555;
    min-height: 16px;
  }
  .error { color: #cc0c39; }
</style>
</head>
<body>
  <h1>Kindle Owned Badge</h1>
  <div class="stats">
    <div>登録冊数: <span class="num" id="totalCount">-</span> 冊</div>
    <div><span class="badge-sample purchase">済</span>購入: <span id="purchaseCount">-</span> 冊</div>
    <div><span class="badge-sample rental">済</span>Unlimited等: <span id="rentalCount">-</span> 冊</div>
    <div><span class="badge-sample captured">済</span>キャプチャ済み: <span id="capturedCount">-</span> 冊</div>
    <div>うち商品ページから収集: <span id="historyCount">-</span> 冊</div>
    <div>最終同期: <span id="lastSync">未同期</span></div>
  </div>
  <button id="syncBtn">ライブラリを同期</button>
  <button id="debugBtn">デバッグ情報をコピー</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
